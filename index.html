<style>
:root{
  --bg:#F2EEDF;
  --card:#FFFDF7;
  --card-alt:#EDE7D3;
  --ink:#2B2620;
  --ink-soft:#5B5346;
  --olive:#3E4A2C;
  --olive-dark:#2E3820;
  --gold:#BE8E2C;
  --gold-soft:#E9D8AE;
  --brick:#A4462F;
  --line:#E1DAC4;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --serif:"Fraunces", Georgia, "Iowan Old Style", serif;
  --sans:"Work Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
:root{color-scheme:light;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;}
a{-webkit-tap-highlight-color:transparent;}
.app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  padding-bottom:calc(56px + env(safe-area-inset-bottom));
  position:relative;
}
body.timer-active .app{ padding-bottom:calc(56px + 78px + env(safe-area-inset-bottom)); }
/* Header */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  background:rgba(242,238,223,0.92);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.iconbtn{
  border:none;
  background:var(--card);
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--olive-dark);
  font-size:18px;
  flex:none;
  cursor:pointer;
  box-shadow:0 1px 0 var(--line) inset;
}
.iconbtn:active{transform:scale(0.94);}
.topbar-title{
  font-family:var(--serif);
  font-weight:600;
  font-size:17px;
  color:var(--olive-dark);
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.topbar-fav{
  border:none;
  background:none;
  font-size:22px;
  color:var(--line);
  cursor:pointer;
  flex:none;
  line-height:1;
  padding:9px;
  -webkit-tap-highlight-color:transparent;
}
.topbar-fav.active{color:var(--brick);}

/* Hero (home) */
.hero{
  padding:26px 20px 18px;
}
.hero .kicker{
  font-size:13px;
  color:var(--ink-soft);
  margin:0 0 4px;
}
.hero h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:34px;
  line-height:1.08;
  margin:0 0 10px;
  color:var(--olive-dark);
}
.hero p{
  margin:0 0 18px;
  color:var(--ink-soft);
  font-size:15px;
  line-height:1.5;
  max-width:46ch;
}
.search-wrap{
  position:relative;
}
.search-wrap input{
  width:100%;
  padding:13px 16px 13px 42px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  font-size:16px;
  color:var(--ink);
  font-family:var(--sans);
  -webkit-appearance:none;
  appearance:none;
}
.search-wrap input:focus{outline:2px solid var(--olive);outline-offset:1px;}
.search-wrap .sicon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--ink-soft);
  font-size:15px;
}

/* Section label */
.section-label{
  font-family:var(--serif);
  font-size:14px;
  font-weight:600;
  color:var(--ink-soft);
  padding:22px 20px 8px;
}

/* TOC list (chapters) */
.toc{
  padding:0 16px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.toc-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 8px;
  border-bottom:1px solid var(--line);
  text-decoration:none;
  color:inherit;
  cursor:pointer;
  background:none;
  border-left:none;border-right:none;border-top:none;
  width:100%;
  text-align:left;
}
.toc-row:active{background:var(--card-alt);}
.toc-num{
  font-family:var(--serif);
  font-size:26px;
  color:var(--gold);
  font-weight:600;
  width:38px;
  flex:none;
  text-align:right;
}
.toc-main{flex:1;min-width:0;}
.toc-main .t{
  font-family:var(--serif);
  font-size:17px;
  font-weight:600;
  color:var(--olive-dark);
  line-height:1.25;
}
.toc-main .m{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:2px;
}
.toc-arrow{color:var(--ink-soft);font-size:15px;flex:none;}

/* Recipe list rows (inside chapter) */
.rlist{
  padding:0 16px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.rrow{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 6px;
  border-bottom:1px solid var(--line);
  background:none;
  border-left:none;border-right:none;border-top:none;
  width:100%;
  text-align:left;
  cursor:pointer;
  color:inherit;
}
.rrow:active{background:var(--card-alt);}
.rrow .rnum{
  font-family:var(--serif);
  font-size:14px;
  color:var(--ink-soft);
  width:20px;
  flex:none;
}
.rrow .rmain{flex:1;min-width:0;}
.rrow .rt{
  font-size:15.5px;
  font-weight:600;
  color:var(--ink);
}
.rrow .rmeta{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:2px;
  display:flex;
  gap:8px;
}
.rrow .rfav{font-size:16px;color:var(--line);flex:none;}
.rrow .rfav.active{color:var(--brick);}

/* Content blocks (chapter narrative + recipe notes) */
.prose{padding:4px 20px 6px;}
.prose h3{
  font-family:var(--serif);
  font-size:19px;
  font-weight:600;
  color:var(--olive-dark);
  margin:22px 0 8px;
}
.prose h4{
  font-family:var(--serif);
  font-size:16px;
  font-weight:600;
  color:var(--olive-dark);
  margin:16px 0 6px;
}
.prose h5{
  font-size:14.5px;
  font-weight:600;
  color:var(--ink);
  margin:14px 0 4px;
}
.prose p{
  font-size:15px;
  line-height:1.6;
  color:var(--ink);
  margin:0 0 10px;
}
.prose ul{
  margin:0 0 10px;
  padding-left:20px;
}
.prose li{
  font-size:15px;
  line-height:1.55;
  color:var(--ink);
  margin-bottom:4px;
}
.prose table{
  width:100%;
  border-collapse:collapse;
  margin:6px 0 14px;
  font-size:14px;
}
.prose table th{
  font-family:var(--serif);
  font-weight:600;
  text-align:left;
  padding:8px 8px;
  border-bottom:2px solid var(--olive);
  color:var(--olive-dark);
}
.prose table td{
  padding:8px 8px;
  border-bottom:1px solid var(--line);
}

/* Chapter hero */
.chero{padding:20px 20px 6px;}
.chero .cnum{
  font-family:var(--serif);
  font-size:15px;
  color:var(--gold);
  font-weight:600;
  margin-bottom:2px;
}
.chero h1{
  font-family:var(--serif);
  font-size:27px;
  font-weight:600;
  line-height:1.15;
  color:var(--olive-dark);
  margin:0;
}

.tipbox{
  margin:18px 16px 8px;
  padding:16px 18px;
  background:var(--olive);
  color:#F4F0DF;
  border-radius:var(--radius-md);
}
.tipbox .tt{
  font-family:var(--serif);
  font-weight:600;
  font-size:15px;
  margin-bottom:6px;
  color:var(--gold-soft);
}
.tipbox p{margin:0 0 8px;font-size:14px;line-height:1.55;}
.tipbox ul{margin:0 0 8px;padding-left:18px;}
.tipbox li{font-size:14px;line-height:1.5;margin-bottom:3px;}
.tipbox p:last-child, .tipbox ul:last-child{margin-bottom:0;}

/* Recipe detail */
.rhero{padding:18px 20px 4px;}
.rhero .crumb{
  font-size:12.5px;
  color:var(--gold);
  font-weight:600;
  margin-bottom:6px;
}
.rhero h1{
  font-family:var(--serif);
  font-size:26px;
  font-weight:600;
  line-height:1.15;
  color:var(--olive-dark);
  margin:0 0 10px;
}
.rhero .desc{
  font-size:15px;
  line-height:1.6;
  color:var(--ink-soft);
  margin:0;
}
.metarow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 20px 4px;
  flex-wrap:wrap;
}
.pill{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 14px;
  font-size:13.5px;
  color:var(--ink);
}
.stepper{
  display:flex;
  align-items:center;
  gap:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
}
.stepper button{
  border:none;
  background:none;
  width:40px;
  height:40px;
  font-size:18px;
  color:var(--olive-dark);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.stepper button:active{background:var(--card-alt);}
.stepper .sval{
  min-width:64px;
  text-align:center;
  font-size:13.5px;
  color:var(--ink);
  padding:0 2px;
}

.block{padding:8px 20px 4px;}
.block h2{
  font-family:var(--serif);
  font-size:19px;
  font-weight:600;
  color:var(--olive-dark);
  margin:18px 0 10px;
}
.ing-list, .step-list{list-style:none;margin:0;padding:0;}
.ing-item{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:9px 2px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.ing-item .box{
  width:19px;height:19px;flex:none;margin-top:1px;
  border-radius:5px;
  border:1.5px solid var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--card);
  font-size:12px;
}
.ing-item.done .box{background:var(--olive);border-color:var(--olive);}
.ing-item .txt{font-size:15px;line-height:1.4;color:var(--ink);}
.ing-item.done .txt{color:var(--ink-soft);text-decoration:line-through;}
.ing-item .amt{font-weight:600;color:var(--olive-dark);}
.ing-item.done .amt{color:var(--ink-soft);}

.step-item{
  display:flex;
  gap:12px;
  padding:11px 2px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  align-items:flex-start;
}
.step-item .snum{
  font-family:var(--serif);
  font-weight:600;
  font-size:15px;
  color:var(--gold);
  width:22px;
  flex:none;
}
.step-item .txt{font-size:15px;line-height:1.55;color:var(--ink);}
.step-item.done .txt{color:var(--ink-soft);text-decoration:line-through;}
.step-item.done .snum{color:var(--ink-soft);}
.txt-col{flex:1;display:flex;flex-direction:column;align-items:flex-start;min-width:0;}

.notecard{
  margin:0 20px 14px;
  padding:14px 16px;
  border-radius:var(--radius-md);
  background:var(--card-alt);
  border:1px solid var(--line);
}
.notecard .nt{
  font-size:13px;
  font-weight:600;
  color:var(--brick);
  margin-bottom:5px;
}
.notecard p{margin:0 0 6px;font-size:14.5px;line-height:1.55;color:var(--ink);}
.notecard ul{margin:0 0 6px;padding-left:18px;}
.notecard li{font-size:14.5px;line-height:1.5;color:var(--ink);margin-bottom:3px;}
.notecard p:last-child,.notecard ul:last-child{margin-bottom:0;}
.notecard.sub{background:none;border:none;padding:2px 2px 2px 4px;margin:0 20px 8px;}
.notecard.sub .nt{color:var(--olive-dark);font-family:var(--serif);font-size:14.5px;}

/* Search results */
.empty{
  padding:40px 24px;
  text-align:center;
  color:var(--ink-soft);
  font-size:14.5px;
}
.results-crumb{
  padding:10px 20px 0;
  font-size:12.5px;
  color:var(--ink-soft);
}

footer.appfooter{
  padding:30px 20px 10px;
  text-align:center;
  font-size:12px;
  color:var(--ink-soft);
}

/* Splash / copertina */
#splash{
  position:fixed;
  inset:0;
  z-index:100;
  background:linear-gradient(180deg, #EFE9D6 0%, var(--bg) 60%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px;
  cursor:pointer;
}
#splash .art{width:190px;height:190px;margin-bottom:6px;}
#splash h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:32px;
  color:var(--olive-dark);
  margin:8px 0 6px;
}
#splash p.tag{
  font-size:14.5px;
  color:var(--ink-soft);
  margin:0 0 30px;
}
#splash .enter{
  border:1.5px solid var(--olive);
  color:var(--olive-dark);
  background:none;
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  padding:12px 26px;
  border-radius:999px;
  cursor:pointer;
}
#splash .hint{
  margin-top:14px;
  font-size:12px;
  color:var(--ink-soft);
  opacity:0.75;
}
#splash.hidden{display:none;}

/* FAB aggiungi ricetta */
.fab{
  position:fixed;
  right:20px;
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:56px;height:56px;
  border-radius:50%;
  background:var(--olive);
  color:#F4F0DF;
  border:none;
  font-size:26px;
  box-shadow:0 6px 18px rgba(46,56,32,0.35);
  cursor:pointer;
  z-index:30;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.fab:active{transform:scale(0.94);}
body.timer-active .fab{ bottom:calc(88px + env(safe-area-inset-bottom)); }

/* Form aggiungi ricetta */
.form-wrap{padding:6px 20px 40px;}
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--olive-dark);
  margin-bottom:6px;
}
.field .hint{font-size:12px;color:var(--ink-soft);margin:3px 0 0;}
.field input[type=text], .field input[type=number], .field textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:var(--radius-sm);
  padding:11px 13px;
  font-size:16px;
  font-family:var(--sans);
  color:var(--ink);
  -webkit-appearance:none;
  appearance:none;
}
.field textarea{resize:vertical;min-height:88px;line-height:1.5;}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}
.btn-primary{
  width:100%;
  border:none;
  background:var(--olive);
  color:#F4F0DF;
  font-family:var(--sans);
  font-weight:600;
  font-size:15px;
  padding:14px;
  border-radius:999px;
  cursor:pointer;
  margin-top:6px;
}
.btn-primary:active{background:var(--olive-dark);}
.btn-ghost{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:600;
  font-size:14px;
  padding:12px;
  border-radius:999px;
  cursor:pointer;
  margin-top:10px;
}
.formnote{
  background:var(--card-alt);
  border-radius:var(--radius-md);
  padding:13px 16px;
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.5;
  margin:2px 20px 18px;
}
.danger-btn{
  border:none;background:none;color:var(--brick);
  font-size:13.5px;font-weight:600;cursor:pointer;
  padding:8px 2px;
}
.export-box textarea{
  width:100%;min-height:220px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--card);
  padding:12px;
  font-size:16px;
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  color:var(--ink);
  -webkit-appearance:none;
  appearance:none;
}

/* Timer nei passaggi */
.step-timer{
  flex:none;
  border:1px solid var(--gold);
  color:var(--gold);
  background:none;
  font-size:12px;
  font-weight:600;
  padding:5px 10px;
  border-radius:999px;
  margin-top:6px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#timerbar{
  position:fixed;
  left:0;right:0;
  bottom:0;
  z-index:40;
  background:var(--olive-dark);
  color:#F4F0DF;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;

/* Nota personale */

  width:100%;

  font-family:var(--sans);

}

  background:none;
  color:var(--olive-dark);

  padding:8px 16px;

}

/* Home quick actions */
.quick-actions{display:flex;gap:10px;padding:0 20px 6px;}

  color:var(--olive-dark);
  font-weight:600;
  font-size:13.5px;
  padding:12px;
  border-radius:999px;
  cursor:pointer;
}

/* Piano settimanale */

  font-family:var(--serif);

}

  padding:12px 20px;

}
.day-row.today{background:var(--card-alt);}
.day-row .dwrap{width:56px;flex:none;}
.day-row .dname{font-size:12px;color:var(--ink-soft);text-transform:capitalize;}
.day-row .dnum{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--olive-dark);}
.day-row .dmain{flex:1;min-width:0;}
.day-row .dmain .rt{font-size:14.5px;font-weight:600;color:var(--ink);}
.day-row .dmain .empty-slot{font-size:14px;color:var(--ink-soft);}
.day-row .dx{
  flex:none;border:none;background:none;color:var(--ink-soft);

}
.pickrow{display:flex;flex-direction:column;}

/* Lista della spesa */
.spesa-item{
  display:flex;align-items:flex-start;gap:11px;
  padding:11px 20px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.spesa-item .box{
  width:20px;height:20px;flex:none;margin-top:1px;
  border-radius:5px;border:1.5px solid var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--card);font-size:12px;
}
.spesa-item.done .box{background:var(--olive);border-color:var(--olive);}
.spesa-item .txt{font-size:15.5px;color:var(--ink);line-height:1.4;}
.spesa-item.done .txt{color:var(--ink-soft);text-decoration:line-through;}
</style>

<script id="data" type="application/json">{"chapters": [{"num": 1, "title": "La nostra filosofia in cucina", "intro": [{"title": "", "level": 0, "text": "Questo ricettario nasce da un'esigenza molto semplice: trovare un modo per mangiare in maniera più varia senza complicare la vita quotidiana.\n\nCome molte coppie che iniziano a vivere insieme, ci siamo accorti che, dopo una giornata di lavoro, la domanda era quasi sempre la stessa:\n\n\"Cosa mangiamo stasera?\"\n\nLa risposta, nella maggior parte dei casi, finiva per essere sempre simile: carne bianca accompagnata da verdure. Una soluzione pratica e veloce, ma che con il tempo è diventata ripetitiva.\n\nDa qui è nata l'idea di raccogliere ricette, suggerimenti e un metodo di organizzazione che ci aiutassero a cambiare gradualmente le nostre abitudini, senza rinunciare alla semplicità.\n\nQuesto ricettario non vuole essere un libro di alta cucina né una raccolta di ricette elaborate. È uno strumento pensato per la nostra casa, costruito attorno alle nostre giornate, ai nostri orari e al tempo che possiamo dedicare alla cucina.\n\nIl nostro obiettivo\n\nL'obiettivo non è cucinare piatti perfetti.\n\nL'obiettivo è riuscire a portare in tavola pasti vari, equilibrati e piacevoli da condividere, anche quando si rientra a casa stanchi.\n\nPer questo motivo abbiamo scelto di privilegiare ricette che siano:\n\nLe nostre abitudini\n\nOgni famiglia costruisce il proprio modo di cucinare.\n\nIl nostro punto di partenza era molto chiaro:\n\nInvece di stravolgere completamente queste abitudini, abbiamo deciso di migliorarle poco alla volta.\n\nLe scelte che abbiamo fatto\n\nPer rendere questo ricettario davvero adatto alla nostra quotidianità abbiamo stabilito alcune linee guida.\n\nCene leggere e veloci\n\nLe cene saranno generalmente composte da:\n\nAbbiamo scelto di evitare, come abitudine, i primi piatti alla sera, preferendo riservare pasta, riso e altri cereali soprattutto ai pranzi.\n\nPranzi più completi\n\nPer il pranzo, soprattutto quando viene portato al lavoro, utilizzeremo più frequentemente:\n\nMolti di questi piatti potranno essere preparati la sera precedente oppure sfruttando gli avanzi della cena.\n\nVarietà senza complicazioni\n\nNon vogliamo eliminare la carne, ma semplicemente alternarla con altre fonti proteiche.\n\nDurante la settimana cercheremo quindi di alternare:\n\nIn questo modo l'alimentazione risulterà più varia senza richiedere ricette complicate.\n\nGli ingredienti della nostra cucina\n\nAbbiamo scelto di costruire il ricettario utilizzando ingredienti semplici, facilmente reperibili durante la normale spesa.\n\nPrediligiamo la cucina italiana tradizionale, con preparazioni casalinghe e sapori familiari.\n\nAbbiamo inoltre deciso di evitare, almeno per il momento:\n\nPer quanto riguarda il pesce, preferiamo acquistarlo fresco quando possibile, evitando quello surgelato, che non rientra nelle nostre abitudini.\n\nCome utilizzare questo ricettario\n\nQuesto libro non è pensato per essere letto dall'inizio alla fine.\n\nPuò essere consultato ogni volta che serve un'idea.\n\nQuando dobbiamo organizzare la settimana possiamo partire dai capitoli dedicati alla pianificazione e alla spesa.\n\nQuando invece manca l'ispirazione, sarà sufficiente scegliere una ricetta dal capitolo dedicato alla categoria che desideriamo cucinare.\n\nL'obiettivo è rendere la cucina un momento più semplice, meno stressante e più piacevole da condividere.\n\nUna promessa a noi stessi\n\nQuesto ricettario non è un insieme di regole rigide.\n\nÈ un punto di partenza.\n\nCon il tempo potremo aggiungere nuove ricette, sperimentare ingredienti diversi e modificare ciò che non rispecchia più le nostre esigenze.", "items": ["semplici da preparare;", "realizzabili con ingredienti facilmente reperibili;", "adatte ai giorni lavorativi;", "organizzabili con una spesa settimanale;", "sufficientemente varie da evitare la monotonia.", "consumavamo carne bianca quasi tutte le sere;", "le verdure erano già presenti quotidianamente, soprattutto carote, zucchine, pomodori e insalata;", "avevamo poche alternative rapide quando non volevamo cucinare carne;", "spesso mancavano idee su come combinare ingredienti semplici.", "una fonte proteica;", "un contorno di verdure;", "pane o patate quando necessario.", "pasta;", "riso;", "cous cous;", "farro.", "carne bianca;", "pesce;", "legumi;", "uova;", "formaggi.", "olive;", "spezie particolarmente aromatiche;", "preparazioni troppo elaborate per la routine settimanale."], "table": null}], "recipes": [], "closing": []}, {"num": 2, "title": "Organizzazione settimanale", "intro": [{"title": "Perché organizzare la settimana", "level": 2, "text": "Una delle difficoltà più comuni quando si vive da soli o in coppia non è cucinare, ma decidere cosa cucinare.\n\nDopo una giornata di lavoro, la stanchezza porta spesso a scegliere il piatto più veloce o quello che si conosce meglio. Nel nostro caso, questo significava mangiare molto spesso carne bianca accompagnata da verdure.\n\nOrganizzare la settimana non significa stabilire un menù rigido da seguire alla lettera, ma creare una struttura semplice che aiuti a distribuire gli alimenti in modo più equilibrato e a ridurre il tempo dedicato alle decisioni.\n\nSapere in anticipo quali saranno le cene principali permette di fare una spesa più mirata, evitare sprechi e affrontare la settimana con maggiore tranquillità.", "items": [], "table": null}, {"title": "Il nostro principio", "level": 1, "text": "Per noi la cucina deve adattarsi alla vita quotidiana, non il contrario.\n\nPer questo motivo abbiamo scelto un'organizzazione flessibile:\n\nSe una sera nasce un imprevisto o semplicemente abbiamo voglia di qualcosa di diverso, non succede nulla: il menù può essere modificato senza compromettere l'equilibrio dell'intera settimana.", "items": ["cene leggere e rapide;", "pranzi più completi;", "una rotazione delle principali fonti proteiche;", "spazio per cambiare programma quando necessario."], "table": null}, {"title": "La struttura della settimana", "level": 1, "text": "Per semplificare la scelta dei pasti abbiamo deciso di assegnare una categoria ad ogni giorno.\n\nQuesta suddivisione non rappresenta una regola fissa, ma un punto di riferimento.", "items": [], "table": {"type": "table", "rows": [["Giorno", "Categoria"], ["Lunedì", "Legumi o cucina vegetariana"], ["Martedì", "Carne bianca"], ["Mercoledì", "Pesce"], ["Giovedì", "Uova o formaggi"], ["Venerdì", "Legumi o cucina vegetariana"], ["Sabato", "Carne o ricetta più elaborata"], ["Domenica", "Libera"]]}}, {"title": "La rotazione delle proteine", "level": 1, "text": "Alternare le principali fonti proteiche permette di rendere l'alimentazione più varia senza aumentare la complessità della cucina.\n\nCome linea guida abbiamo scelto di consumare mediamente:\n\nQueste frequenze non devono essere interpretate come un obbligo. Sono semplicemente un aiuto per evitare di ricadere sempre negli stessi piatti.", "items": [], "table": {"type": "table", "rows": [["Alimento", "Frequenza indicativa"], ["Carne bianca", "2-3 volte"], ["Pesce", "1 volta"], ["Legumi", "2 volte"], ["Uova", "1 volta"], ["Formaggi", "1 volta"], ["Carne rossa", "1 volta ogni 7-10 giorni"]]}}, {"title": "La differenza tra pranzo e cena", "level": 1, "text": "Durante la progettazione di questo ricettario abbiamo deciso di distinguere chiaramente i due pasti principali della giornata.", "items": [], "table": null}, {"title": "Il pranzo", "level": 2, "text": "Il pranzo rappresenta il momento ideale per consumare piatti più completi dal punto di vista dei carboidrati.\n\nPer questo motivo saranno presenti soprattutto:\n\nMolte di queste preparazioni possono essere portate al lavoro e risultano ottime anche il giorno successivo.", "items": ["pasta;", "riso;", "cous cous;", "farro;", "piatti unici."], "table": null}, {"title": "La cena", "level": 2, "text": "La cena sarà generalmente più semplice.\n\nLa struttura che utilizzeremo più spesso sarà composta da:\n\nQuesta scelta ci permette di preparare pasti completi in poco tempo senza appesantire la digestione prima di andare a dormire.", "items": ["una fonte proteica;", "una o due porzioni di verdura;", "pane oppure patate quando necessari."], "table": null}, {"title": "Le tre tipologie di serata", "level": 1, "text": "Non tutte le giornate sono uguali.\n\nPer questo motivo abbiamo suddiviso le cene in tre livelli di impegno.", "items": [], "table": null}, {"title": "🟢 Serate veloci", "level": 2, "text": "Quando rientriamo tardi o siamo particolarmente stanchi.\n\nTempo indicativo:\n10-20 minuti\n\nEsempi:", "items": ["caprese completa;", "uova al pomodoro;", "toast completo;", "ceci con mozzarella e verdure;", "crostoni con ricotta."], "table": null}, {"title": "🟡 Serate standard", "level": 2, "text": "Le cene della maggior parte della settimana.\n\nTempo indicativo:\n20-35 minuti\n\nEsempi:", "items": ["pollo con zucchine;", "tacchino ai funghi;", "salmone al forno;", "frittata con verdure;", "polpette di lenticchie."], "table": null}, {"title": "🔴 Serate speciali", "level": 2, "text": "Quando abbiamo più tempo oppure vogliamo preparare qualcosa di diverso.\n\nTempo indicativo:\noltre 35 minuti\n\nEsempi:", "items": ["involtini di pollo;", "parmigiana di zucchine;", "orata al cartoccio."], "table": null}, {"title": "Organizzare i pranzi", "level": 1, "text": "Quando possibile, preferiamo sfruttare ciò che cuciniamo per la cena.\n\nPreparare una porzione in più richiede poco impegno e permette di avere già pronta la base del pranzo successivo.\n\nAlcuni esempi:\n\nQuesto semplice accorgimento riduce il tempo trascorso in cucina e limita gli sprechi.", "items": ["pollo avanzato → insalata di pollo o riso con pollo;", "frittata → panino oppure pranzo freddo;", "salmone → pasta o insalata;", "verdure cotte → contorno oppure condimento per un primo."], "table": null}, {"title": "Una settimana ben riuscita", "level": 1, "text": "Per noi una settimana non è \"ben organizzata\" perché abbiamo seguito perfettamente il menù.\n\nÈ ben organizzata quando:\n\nQuesta sarà la vera misura del successo del nostro ricettario: non la perfezione, ma la serenità con cui riusciremo a vivere la cucina ogni giorno.", "items": ["abbiamo mangiato in modo vario;", "non abbiamo dovuto improvvisare ogni sera;", "la spesa è stata sufficiente;", "abbiamo limitato gli sprechi;", "cucinare non è diventato un motivo di stress."], "table": null}], "recipes": [], "closing": []}, {"num": 3, "title": "La lista della spesa intelligente", "intro": [{"title": "Perché organizzare la spesa", "level": 2, "text": "Una buona organizzazione della cucina inizia ancora prima di accendere i fornelli.\n\nMolto spesso la sensazione di \"non sapere cosa cucinare\" nasce semplicemente dal fatto che manca uno o due ingredienti fondamentali. Questo porta a cambiare programma, acquistare cibi pronti o preparare sempre gli stessi piatti.\n\nPer questo motivo abbiamo deciso di organizzare la spesa in modo semplice e funzionale, distinguendo gli alimenti in base alla loro frequenza di acquisto.\n\nL'obiettivo non è riempire la dispensa, ma avere sempre gli ingredienti giusti per preparare le ricette del ricettario.", "items": [], "table": null}, {"title": "Il nostro metodo", "level": 1, "text": "Abbiamo suddiviso la spesa in tre categorie:\n\nQuesta organizzazione ci permette di mantenere una cucina ordinata e di ridurre gli sprechi.", "items": ["Dispensa, composta da alimenti a lunga conservazione.", "Frigorifero, con i prodotti freschi da acquistare ogni settimana.", "Freezer, da utilizzare come supporto e non come deposito."], "table": null}, {"title": "La dispensa", "level": 1, "text": "La dispensa contiene gli ingredienti che dovrebbero essere sempre disponibili.\n\nSono alimenti versatili, con una lunga conservazione e utilizzabili in molte ricette.", "items": [], "table": null}, {"title": "Cereali e derivati", "level": 2, "text": "Questi ingredienti saranno utilizzati principalmente per i pranzi.", "items": [], "table": {"type": "table", "rows": [["Prodotto", "Quantità consigliata"], ["Pasta corta", "2 kg"], ["Spaghetti", "1 kg"], ["Riso", "1 kg"], ["Cous cous", "500 g"], ["Farro", "500 g"]]}}, {"title": "Legumi", "level": 2, "text": "I legumi rappresentano una valida alternativa alla carne e permettono di preparare numerose ricette in poco tempo.", "items": [], "table": {"type": "table", "rows": [["Prodotto", "Quantità consigliata"], ["Ceci", "6 confezioni"], ["Lenticchie", "4 confezioni"], ["Fagioli borlotti o cannellini", "4 confezioni"]]}}, {"title": "Pomodoro e conserve", "level": 2, "text": "Tenere sempre disponibili:\n\nSono la base di molte preparazioni e consentono di improvvisare facilmente un pranzo o una cena.", "items": ["passata di pomodoro;", "pomodori pelati;", "concentrato di pomodoro."], "table": null}, {"title": "Pesce in scatola", "level": 2, "text": "Da utilizzare come soluzione di emergenza.\n\nConsigliati:\n\nNon sostituiscono il pesce fresco, ma rappresentano un'ottima risorsa quando il tempo è poco.", "items": ["tonno;", "sgombro."], "table": null}, {"title": "Altri ingredienti indispensabili", "level": 2, "text": "", "items": ["olio extravergine d'oliva;", "sale;", "aceto;", "farina;", "pangrattato."], "table": null}, {"title": "Il frigorifero", "level": 1, "text": "La spesa del frigorifero viene effettuata generalmente una volta alla settimana.", "items": [], "table": null}, {"title": "Verdure sempre presenti", "level": 2, "text": "Abbiamo scelto di mantenere costantemente disponibili:\n\nSono gli ingredienti che utilizziamo più frequentemente durante tutta la settimana.", "items": ["insalata;", "pomodori;", "zucchine;", "carote."], "table": null}, {"title": "Verdure di stagione", "level": 2, "text": "Ogni settimana sarà possibile aggiungere due o tre verdure differenti, seguendo la stagionalità.\n\nAd esempio:\n\nIn questo modo le ricette cambieranno naturalmente durante l'anno.", "items": ["melanzane;", "peperoni;", "broccoli;", "cavolfiore;", "spinaci;", "fagiolini."], "table": null}, {"title": "Latticini", "level": 2, "text": "Cerchiamo di avere sempre in frigorifero:\n\nA rotazione possiamo aggiungere:", "items": ["mozzarella;", "ricotta;", "parmigiano.", "scamorza;", "provola;", "stracchino;", "crescenza."], "table": null}, {"title": "Uova", "level": 2, "text": "Le uova rappresentano uno degli ingredienti più versatili della nostra cucina.\n\nPer questo motivo cercheremo di mantenerne sempre una confezione disponibile.", "items": [], "table": null}, {"title": "Carne", "level": 2, "text": "Preferiamo acquistare la carne una volta alla settimana.\n\nGeneralmente scegliamo:\n\nUna volta rientrati dalla spesa, la dividiamo subito in porzioni adatte alle ricette che intendiamo preparare durante la settimana.\n\nQuesto semplice gesto permette di velocizzare la preparazione delle cene.", "items": ["pollo;", "tacchino."], "table": null}, {"title": "Pesce", "level": 2, "text": "Quando possibile preferiamo acquistare pesce fresco una volta alla settimana.\n\nL'obiettivo non è fare grandi scorte, ma programmare una cena dedicata al pesce durante la settimana.", "items": [], "table": null}, {"title": "Il freezer", "level": 1, "text": "Il freezer rappresenta un aiuto, non il luogo dove accumulare alimenti dimenticati.\n\nLo utilizziamo principalmente per conservare:\n\nEvitiamo invece di congelare alimenti che perderebbero qualità o che preferiamo consumare freschi.", "items": ["pane già tagliato;", "carne porzionata;", "preparazioni già cotte, come polpette, sughi o parmigiana."], "table": null}, {"title": "Una settimana di spesa tipo", "level": 1, "text": "", "items": [], "table": null}, {"title": "Proteine", "level": 2, "text": "☐ Pollo o tacchino\n\n☐ Pesce fresco\n\n☐ Uova\n\n☐ Mozzarella\n\n☐ Ricotta", "items": [], "table": null}, {"title": "Verdure", "level": 2, "text": "☐ Insalata\n\n☐ Pomodori\n\n☐ Zucchine\n\n☐ Carote\n\n☐ Due o tre verdure di stagione", <script>(function(){
"use strict";

var DATA = JSON.parse(document.getElementById('data').textContent);
var CHAPTERS = DATA.chapters;

function chapterByNum(n){
  if(n === CUSTOM_CHAPTER_NUM) return getCustomChapter();
  return CHAPTERS.find(function(c){ return c.num === n; });
}
function recipeByNums(cn, rn){
  var c = chapterByNum(cn);
  if(!c) return null;
  var r = c.recipes.find(function(x){ return x.num === rn; });
  return r ? {chapter:c, recipe:r} : null;
}

/* ---------- helpers ---------- */
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function normalize(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function withBr(text){
  return esc(text).split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
}
function paraHtml(text){
  if(!text) return '';
  return text.split(/\n\n+/).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
}
function listHtml(items){
  if(!items || !items.length) return '';
  return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';
}
function tableHtml(t){
  if(!t || !t.rows || !t.rows.length) return '';
  var rows = t.rows;
  var head = rows[0], body = rows.slice(1);
  var h = '<table><thead><tr>'+head.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  body.forEach(function(r){
    h += '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';
  });
  h += '</tbody></table>';
  return h;
}

/* ---------- ingredient quantity scaling ---------- */
var NUM_RE = /^(\d+(?:[.,]\d+)?)(\s?)(.*)$/;
function fmtNum(n){
  var r = Math.round(n*2)/2; // nearest 0.5
  if(Math.abs(r - Math.round(r)) < 0.01) return String(Math.round(r));
  return String(r).replace('.', ',');
}
function scaleIngredientText(text, factor){
  if(factor === 1) return {amt:null, rest:text};
  var m = NUM_RE.exec(text);
  if(!m) return {amt:null, rest:text};
  var num = parseFloat(m[1].replace(',', '.'));
  var scaled = num * factor;
  return {amt: fmtNum(scaled), rest: m[3]};
}
function ingredientHtml(text, factor){
  var m = NUM_RE.exec(text);
  if(!m){ return '<span class="txt">'+esc(text)+'</span>'; }
  var num = parseFloat(m[1].replace(',', '.'));
  var newNum = factor === 1 ? m[1] : fmtNum(num*factor);
  return '<span class="txt"><span class="amt">'+esc(newNum)+'</span> '+esc(m[3])+'</span>';
}

/* ---------- local persistence (localStorage: works once the page is
   hosted online or opened as a file, on this browser/device only) ---------- */
var LS_FAV = 'ricettario_favorites_v1';
var LS_MINE = 'ricettario_mie_ricette_v1';

function lsGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, val); return true; }catch(e){ return false; }
}

var favorites = {};
function favKey(cn, rn){ return cn+'-'+rn; }
function loadFavorites(){
  var raw = lsGet(LS_FAV);
  if(raw){
    try{ var arr = JSON.parse(raw); arr.forEach(function(k){ favorites[k] = true; }); }catch(e){}
  }
}
function saveFavorites(){
  lsSet(LS_FAV, JSON.stringify(Object.keys(favorites)));
}
function isFav(cn, rn){ return !!favorites[favKey(cn,rn)]; }
function toggleFav(cn, rn, ev){
  if(ev) ev.stopPropagation();
  var k = favKey(cn, rn);
  if(favorites[k]) delete favorites[k]; else favorites[k] = true;
  saveFavorites();
  render();
}

/* ---------- "le mie ricette": added on this device, stored locally ---------- */
var CUSTOM_CHAPTER_NUM = 900;
var customRecipes = [];
function loadCustomRecipes(){
  var raw = lsGet(LS_MINE);
  if(raw){
    try{ customRecipes = JSON.parse(raw) || []; }catch(e){ customRecipes = []; }
  }
}
function saveCustomRecipes(){
  lsSet(LS_MINE, JSON.stringify(customRecipes));
  buildSearchIndex();
}
function getCustomChapter(){
  return {num:CUSTOM_CHAPTER_NUM, title:'Le mie ricette', recipes:customRecipes, intro:[], closing:[]};
}
function addCustomRecipe(r){
  r.num = Date.now();
  r.custom = true;

/* ---------- timer nei passaggi ---------- */
var DURATION_RE = /(\d+)\s*(?:-\s*\d+\s*)?(minuti|minuto|min|ore|ora|secondi|second[oi])\b/i;
function parseDurationSeconds(text){
  var m = DURATION_RE.exec(text);
  if(!m) return null;
  var n = parseInt(m[1], 10);
  var unit = m[2].toLowerCase();
  if(unit.indexOf('or') === 0) return n*3600;
  if(unit.indexOf('sec') === 0) return n;
  return n*60;
}
function fmtDurationShort(s){
  if(s < 60) return s+' sec';
  if(s % 60 === 0) return (s/60)+' min';
  return Math.round(s/60)+' min';
}
function fmtClock(s){
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s/60), sec = s%60;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}
var timer = null;
function renderTimerBar(){
  var el = document.getElementById('timerbar');
  if(!el) return;
  if(!timer){
    el.className = '';
    el.innerHTML = '';
    document.body.classList.remove('timer-active');
    return;
  }
  document.body.classList.add('timer-active');
  el.className = 'show' + (timer.state==='done' ? ' done' : '');
  var icon = timer.state==='running' ? '&#10074;&#10074;' : '&#9654;';
  el.innerHTML =
    '<div class="tlabel"><div class="tt">'+esc(timer.label)+'</div><div class="tv">'+(timer.state==='done' ? 'Fatto! \u2713' : fmtClock(timer.remaining))+'</div></div>'+
    (timer.state!=='done' ? '<button onclick="toggleTimerPause()" aria-label="Pausa">'+icon+'</button>' : '') +
    '<button onclick="cancelTimer()" aria-label="Chiudi">&#10005;</button>';
}
function timerTick(){
  if(!timer || timer.state!=='running') return;
  timer.remaining -= 1;
  if(timer.remaining <= 0){
    timer.remaining = 0;
    timer.state = 'done';
    clearInterval(timer.intervalId);
    if(navigator.vibrate){ try{ navigator.vibrate([200,100,200,100,200]); }catch(e){} }
    playBeep();
  }
  renderTimerBar();
}
function playBeep(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    [0,0.32,0.64].forEach(function(t){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.28);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.3);
    });
  }catch(e){}
}
function startTimerInternal(seconds, label){
  if(timer && timer.intervalId) clearInterval(timer.intervalId);
  timer = {remaining:seconds, label:label, state:'running'};
  timer.intervalId = setInterval(timerTick, 1000);
  renderTimerBar();
}
window.startStepTimerFromBtn = function(btn, ev){
  if(ev) ev.stopPropagation();
  var secs = parseInt(btn.getAttribute('data-secs'), 10);
  var label = btn.getAttribute('data-label');
  startTimerInternal(secs, label);
};
window.toggleTimerPause = function(){
  if(!timer) return;
  if(timer.state==='running'){ timer.state='paused'; clearInterval(timer.intervalId); }
  else if(timer.state==='paused'){ timer.state='running'; timer.intervalId=setInterval(timerTick,1000); }
  renderTimerBar();
};
window.cancelTimer = function(){
  if(timer && timer.intervalId) clearInterval(timer.intervalId);
  timer = null;
  renderTimerBar();
};

var LS_SPESA = 'ricettario_spesa_check_v1';
var spesaChecked = {};
function loadSpesaChecked(){

  if(raw){ try{ spesaChecked = JSON.parse(raw) || {}; }catch(e){ spesaChecked = {}; } }

function safeKey(s){ return normalize(s).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
function buildShoppingList(lines){
  var groups = {};
  lines.forEach(function(txt){
    var m = NUM_RE.exec(txt);
    var num=null, rest;
    if(m){ num = parseFloat(m[1].replace(',', '.')); rest = m[3].trim(); }
    else { rest = txt.trim(); }
    if(!rest) rest = txt.trim();
    var k = normalize(rest);
    if(!groups[k]) groups[k] = {rest:rest, total:0, hasNum:false, count:0};
    groups[k].count++;
    if(num!==null){ groups[k].total += num; groups[k].hasNum = true; }
  });
  var out = Object.keys(groups).map(function(k){
    var g = groups[k];
    var label = g.hasNum ? (fmtNum(g.total)+' '+g.rest) : (g.count>1 ? g.rest+' (x'+g.count+')' : g.rest);
    return {key:safeKey(g.rest), label:label};
  });
  out.sort(function(a,b){ return a.label.localeCompare(b.label); });
  return out;
}

function parseHash(){
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/').filter(Boolean);
  if(parts.length === 0) return {view:'home'};
  if(parts[0] === 'c' && parts[1] && parts[2] === 'r' && parts[3]){
    return {view:'recipe', cnum:parseInt(parts[1],10), rnum:parseInt(parts[3],10)};
  }
  if(parts[0] === 'c' && parts[1]){
    return {view:'chapter', cnum:parseInt(parts[1],10)};
  }
  if(parts[0] === 'search'){
    return {view:'search', q: decodeURIComponent(parts[1]||'')};
  }
  if(parts[0] === 'nuova'){
    return {view:'nuova'};
  }
  if(parts[0] === 'esporta'){
    return {view:'esporta'};
  }
  if(parts[0] === 'piano' && parts[1] === 'pick' && parts[2]){
    return {view:'pianopick', slot:parts[2]};
  }
  if(parts[0] === 'piano'){
    return {view:'piano'};
  }
  if(parts[0] === 'spesa'){
    return {view:'spesa'};
  }
  if(parts[0] === 'random'){
    return {view:'random'};
  }
  return {view:'home'};
}

}

function renderNewRecipeForm(){
  var html = topbar({back:'#/c/'+CUSTOM_CHAPTER_NUM, title:'Nuova ricetta'});
  html += '<div class="chero" style="padding-bottom:2px;"><h1>Aggiungi una ricetta</h1></div>';
  html += '<div class="formnote">Viene salvata solo su questo telefono, dentro \u201cLe mie ricette\u201d. Puoi esportarla in qualsiasi momento e mandarmela per inserirla nel libro ufficiale.</div>';
  html += '<form class="form-wrap" onsubmit="return submitNewRecipe(event)">'+
    '<div class="field"><label>Titolo</label><input type="text" name="titolo" required placeholder="Es. Zuppa di ceci e rosmarino"></div>'+
    '<div class="row2">'+
      '<div class="field"><label>Persone</label><input type="number" name="persone" min="1" max="20" placeholder="2"></div>'+
      '<div class="field"><label>Tempo</label><input type="text" name="tempo" placeholder="20 minuti"></div>'+
    '</div>'+
    '<div class="field"><label>Descrizione</label><textarea name="descrizione" placeholder="Due righe su questo piatto\u2026" style="min-height:60px;"></textarea></div>'+
    '<div class="field"><label>Ingredienti</label><textarea name="ingredienti" required placeholder="Un ingrediente per riga, es.\n200 g di ceci\n1 rametto di rosmarino\nolio extravergine d\'oliva"></textarea><p class="hint">Un ingrediente per riga. Le quantit\u00e0 all\'inizio della riga verranno adattate se cambi il numero di persone.</p></div>'+
    '<div class="field"><label>Preparazione</label><textarea name="preparazione" required placeholder="Un passaggio per riga, es.\nSoffriggere il rosmarino nell\'olio.\nAggiungere i ceci e coprire d\'acqua."></textarea><p class="hint">Un passaggio per riga.</p></div>'+
    '<div class="field"><label>Nota (facoltativa)</label><textarea name="note" placeholder="Varianti, consigli, come conservarla\u2026" style="min-height:60px;"></textarea></div>'+
    '<button type="submit" class="btn-primary">Salva ricetta</button>'+
  '</form>';
  return html;
}

function renderExport(){
  var html = topbar({back:'#/c/'+CUSTOM_CHAPTER_NUM, title:'Esporta'});
  html += '<div class="chero" style="padding-bottom:2px;"><h1>Le tue ricette in testo</h1></div>';
  if(!customRecipes.length){
    html += '<div class="empty">Non hai ancora ricette da esportare.</div>';
    return html;
  }
  html += '<div class="formnote">Copia questo testo e incollalo qui in chat, cos\u00ec posso inserire queste ricette in modo permanente nel libro e nell\'app.</div>';
  var json = JSON.stringify(customRecipes, null, 1);
  html += '<div class="form-wrap export-box"><textarea id="exportText" readonly>'+esc(json)+'</textarea>'+
    '<button id="copyBtn" class="btn-primary" onclick="copyExport()">Copia</button></div>';
  return html;
}

function renderPiano(){
  var html = topbar({back:'#/', title:'Piano settimanale'});
  html += '<div class="chero" style="padding-bottom:2px;"><h1>Cosa cuciniamo</h1></div>';
  html += '<div class="formnote">Un piano settimanale generico da riusare ogni settimana \u2014 non \u00e8 legato a date precise. Tocca un pasto per assegnargli una ricetta.</div>';
  PIANO_DAYS.forEach(function(day){
    html += '<div class="week-label">'+day.label+'</div>';
    PIANO_MEALS.forEach(function(meal){
      var slot = day.key+'-'+meal.key;
      var assigned = piano[slot];
      var rec = assigned ? recipeByNums(assigned.cnum, assigned.rnum) : null;
      html += '<button class="day-row" onclick="nav(\'#/piano/pick/'+slot+'\')">'+
        '<div class="dwrap" style="text-align:center;"><div style="font-size:21px;">'+meal.icon+'</div></div>'+
        '<div class="dmain"><div class="dname" style="text-transform:none;">'+meal.label+'</div>'+
        (rec ? '<div class="rt">'+esc(rec.recipe.title)+'</div>' : '<div class="empty-slot">Aggiungi</div>')+'</div>'+
        (rec ? '<span class="dx" onclick="removeFromPiano(\''+slot+'\',event)">&#10005;</span>' : '') +
        '</button>';
    });
  });
  html += '<div class="form-wrap"><button class="btn-primary" onclick="nav(\'#/spesa\')">Genera lista della spesa</button></div>';
  return html;
}

function pickResultsHtml(slot, q){
  var nq = normalize(q);
  var list = nq ? searchIndex.filter(function(it){ return it.hay.indexOf(nq) !== -1; }) : searchIndex;
  if(!list.length) return '<div class="empty">Nessuna ricetta trovata.</div>';
  return list.map(function(it){
    return '<button class="rrow" onclick="assignToPiano(\''+slot+'\','+it.cnum+','+it.rnum+')">'+
      '<div class="rnum">&#127860;</div>'+
      '<div class="rmain"><div class="rt">'+esc(it.title)+'</div><div class="rmeta">'+esc(it.ctitle)+'</div></div>'+
      '</button>';
  }).join('');
}
window.onPickFilter = function(val){
  var route = parseHash();
  var el = document.getElementById('pickResults');
  if(el) el.innerHTML = pickResultsHtml(route.slot, val);
};
function renderPianoPick(slot){
  var parts = slot.split('-');
  var day = pianoDayByKey(parts[0]);
  var meal = pianoMealByKey(parts[1]);
  var label = (day?day.label:'') + ' \u2014 ' + (meal?meal.label:'');
  var html = topbar({back:'#/piano', title:label});
  html += '<div class="hero" style="padding-bottom:6px;"><div class="search-wrap"><span class="sicon">&#128269;</span>'+
    '<input id="searchInput" type="text" placeholder="Cerca una ricetta\u2026" oninput="onPickFilter(this.value)"></div></div>';
  html += '<div id="pickResults" class="rlist pickrow">'+pickResultsHtml(slot, '')+'</div>';
  return html;
}

function renderSpesa(){
  var html = topbar({back:'#/piano', title:'Lista della spesa'});
  html += '<div class="chero" style="padding-bottom:2px;"><h1>Lista della spesa</h1></div>';
  var slots = Object.keys(piano);
  if(!slots.length){
    html += '<div class="empty">Non hai ancora pianificato nessun pasto.<br>Vai al piano settimanale per aggiungerne.</div>';
    return html;
  }
  var lines = [];
  var recipeNames = [];
  slots.forEach(function(slot){
    var a = piano[slot];
    var found = recipeByNums(a.cnum, a.rnum);
    if(found){
      recipeNames.push(found.recipe.title);
      found.recipe.ingredients.forEach(function(ing){ lines.push(ing); });
    }
  });
  var items = buildShoppingList(lines);
  html += '<div class="formnote">Dai pasti pianificati: '+esc(recipeNames.join(', '))+'</div>';
  html += '<div>'+items.map(function(it){
    var done = spesaChecked[it.key];
    return '<div class="spesa-item '+(done?'done':'')+'" onclick="toggleSpesa(\''+it.key+'\')">'+
      '<span class="box">'+(done?'&#10003;':'')+'</span><span class="txt">'+esc(it.label)+'</span></div>';
  }).join('')+'</div>';
  return html;
}

function renderSearch(q){
  var nq = normalize(q);
  var results = nq ? searchIndex.filter(function(it){ return it.hay.indexOf(nq) !== -1; }) : [];
  var html = topbar({back:'#/', title:'Ricerca'});
  html += '<div class="hero" style="padding-bottom:6px;"><div class="search-wrap"><span class="sicon">&#128269;</span>'+
    '<input id="searchInput" type="text" placeholder="Cerca una ricetta o un ingrediente\u2026" value="'+esc(q)+'" oninput="onSearchInput(this.value)" autofocus></div></div>';

  if(!nq){
    html += '<div class="empty">Scrivi il nome di una ricetta o di un ingrediente.</div>';
    return html;
  }
  if(!results.length){
    html += '<div class="empty">Nessuna ricetta trovata per \u201c'+esc(q)+'\u201d.</div>';
    return html;
  }
  html += '<div class="results-crumb">'+results.length+' risultat'+(results.length===1?'o':'i')+'</div>';
  html += '<div class="rlist">'+results.map(function(it){
    var fav = isFav(it.cnum, it.rnum);
    return '<button class="rrow" onclick="nav(\'#/c/'+it.cnum+'/r/'+it.rnum+'\')">'+
      '<div class="rnum">&#127860;</div>'+
      '<div class="rmain"><div class="rt">'+esc(it.title)+'</div><div class="rmeta">'+esc(it.ctitle)+'</div></div>'+
      '<span class="rfav '+(fav?'active':'')+'" onclick="toggleFav('+it.cnum+','+it.rnum+',event)">'+(fav?'&#9733;':'&#9734;')+'</span>'+
      '</button>';
  }).join('')+'</div>';
  return html;
}

function renderNotFound(){
  return topbar({back:'#/'}) + '<div class="empty">Contenuto non trovato.</div>';
}

var searchDebounce;
window.onSearchInput = function(val){
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function(){
    nav('#/search/'+encodeURIComponent(val));
  }, 220);
};

function render(){
  var route = parseHash();
  if(route.view === 'random'){
    pickRandomRecipe();
    return;
  }
  var html;
  if(route.view === 'home') html = renderHome();
  else if(route.view === 'chapter') html = renderChapter(route.cnum);
  else if(route.view === 'recipe') html = renderRecipe(route.cnum, route.rnum);
  else if(route.view === 'search') html = renderSearch(route.q);
  else if(route.view === 'nuova') html = renderNewRecipeForm();
  else if(route.view === 'esporta') html = renderExport();
  else if(route.view === 'piano') html = renderPiano();
  else if(route.view === 'pianopick') html = renderPianoPick(route.slot);
  else if(route.view === 'spesa') html = renderSpesa();
  else html = renderNotFound();
  appEl.innerHTML = html;
  window.scrollTo(0,0);
  var input = document.getElementById('searchInput');
  if(input && route.view === 'search'){
    input.focus();
    var v = input.value; input.value=''; input.value=v;
  }
}

document.addEventListener('DOMContentLoaded', function(){
  appEl = document.getElementById('app');
  loadFavorites();
  loadCustomRecipes();
  loadNotes();
  loadPiano();
  loadSpesaChecked();
  buildSearchIndex();
  render();
});
window.addEventListener('hashchange', render);

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

})();
</script>
</body>
</html>
