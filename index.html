prezzemolo tritato", "scorza di ½ limone", "olio extravergine d'oliva", "sale e pepe"], "steps": ["Disporre i filetti su una teglia rivestita di carta forno, salarli, peparli e ungerli con un filo d'olio.", "Mescolare il pangrattato con l'aglio tritato finemente, il prezzemolo, la scorza di limone, sale e un cucchiaio d'olio, fino a ottenere un composto sabbioso.", "Cospargere i filetti con la panatura, premendola leggermente.", "Cuocere in forno statico a 190°C (170°C se ventilato) per 15-20 minuti (fino a 25 se i filetti sono molto spessi), finché la superficie non sarà dorata."], "time": "35 minuti", "notes": [], "num": 15}, {"title": "Orata al cartoccio", "description": "Il pesce intero cotto nel suo cartoccio: resta morbido e profumato, con pochissimo condimento.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["1 orata da circa 500-600 g, già pulita", "8 pomodorini", "2 spicchi d'aglio", "prezzemolo tritato", "olive nere (facoltative)", "1 cucchiaio di capperi dissalati (facoltativi)", "olio extravergine d'oliva", "sale q.b."], "steps": ["Preparare un foglio grande di carta forno e ungerlo con un filo d'olio.", "Salare l'orata dentro e fuori e riempire la pancia con uno spicchio d'aglio, un po' di prezzemolo e qualche pomodorino.", "Adagiarla sul foglio con i pomodorini rimasti tagliati a metà, l'altro spicchio d'aglio tritato, le olive e i capperi, poi condire con un filo d'olio.", "Chiudere la carta a forma di caramella, sigillando bene i bordi, e sistemare il cartoccio in una teglia.", "Cuocere in forno statico a 200°C (180°C se ventilato) per 30-35 minuti, poi aprire il cartoccio con cautela e controllare la cottura: la polpa deve staccarsi facilmente dalla lisca."], "time": "45 minuti", "notes": [{"title": "Nota", "level": 1, "text": "Con un pesce più grande (700-800 g) servono qualche minuto in più. La stessa ricetta va bene anche per branzino o spigola.", "items": []}], "num": 16}, {"num": 17, "title": "Orata al forno con patate", "description": "Un grande classico della cucina italiana, ideale quando vogliamo preparare una cena più tradizionale.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["2 orate pulite (circa 300 g l'una)", "400 g di patate", "150 g di pomodorini", "3 cucchiai di olio extravergine d'oliva", "1 rametto di rosmarino", "½ limone", "sale q.b."], "steps": ["Sbucciare le patate e tagliarle a fettine sottili; condirle con olio, sale e rosmarino e cuocerle in una teglia in forno statico a 200°C (180°C se ventilato) per 15-20 minuti.", "Salare le orate all'interno, inserire qualche fetta di limone e rosmarino.", "Adagiare i pesci sulle patate, unire i pomodorini e condire con l'olio rimasto.", "Proseguire la cottura per altri 20 minuti circa."], "time": "45 minuti", "notes": []}, {"title": "Pesce spada con pomodorini e olive", "description": "Tranci di pesce spada in padella con pomodorini, olive e capperi: un secondo dal sapore siciliano.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["2 tranci di pesce spada (circa 150 g l'uno)", "10 pomodorini", "1 spicchio d'aglio", "12 olive nere", "1 cucchiaio di capperi dissalati", "prezzemolo tritato", "olio extravergine d'oliva", "sale q.b."], "steps": ["Scaldare l'olio in una padella con l'aglio, poi aggiungere i pomodorini tagliati a metà, le olive e i capperi.", "Cuocere a fuoco medio per 5 minuti, finché i pomodorini non iniziano ad ammorbidirsi.", "Adagiare i tranci di pesce spada nel sugo, salare leggermente e cuocere 4-5 minuti per lato, con il coperchio.", "Completare con prezzemolo tritato e servire con il sughetto."], "time": "25 minuti", "notes": [{"title": "Nota", "level": 1, "text": "Il pesce spada si asciuga facilmente: meglio non cuocerlo troppo.", "items": []}], "num": 18, "stagioni": "E"}, {"title": "Polpette di tonno e patate", "description": "Un secondo economico con ingredienti sempre in dispensa, morbide dentro e dorate fuori.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["300 g di patate", "160 g di tonno sott'olio sgocciolato", "1 uovo", "30 g di parmigiano grattugiato", "prezzemolo tritato", "pangrattato q.b.", "sale e pepe", "olio extravergine d'oliva"], "steps": ["Lessare le patate con la buccia per circa 30 minuti, sbucciarle e schiacciarle con una forchetta in una ciotola, lasciandole intiepidire.", "Aggiungere il tonno sgocciolato e sminuzzato, l'uovo, il parmigiano, il prezzemolo, sale e pepe, e mescolare bene.", "Unire il pangrattato poco alla volta fino a ottenere un composto lavorabile, formare delle polpette e passarle nel pangrattato.", "Disporle su una teglia con carta forno, spennellarle con un filo d'olio e cuocere in forno statico a 180°C (160°C se ventilato) per 20 minuti, girandole a metà cottura."], "time": "1 ora", "notes": [{"title": "Variante", "level": 1, "text": "Si possono cuocere anche in padella con un filo d'olio, 4-5 minuti per lato.", "items": []}], "num": 19}, {"title": "Polpo e patate", "description": "Un classico della cucina di mare, servito tiepido con patate e limone: ottimo anche il giorno dopo.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["1 polpo da circa 800 g, già pulito", "3 patate medie", "1 foglia di alloro", "1 limone", "prezzemolo tritato", "olive nere (facoltative)", "olio extravergine d'oliva", "sale e pepe"], "steps": ["Portare a bollore una pentola capiente di acqua salata con l'alloro. Tenendo il polpo per la testa, immergere i tentacoli 3-4 volte nell'acqua per farli arricciare, poi immergerlo del tutto.", "Coprire e cuocere a fuoco basso, a leggero bollore, per circa 40-45 minuti, finché una forchetta non entra facilmente nella parte più spessa.", "Spegnere il fuoco e lasciar raffreddare il polpo nella sua acqua di cottura per almeno 30 minuti: è il segreto per averlo tenero.", "Nel frattempo lessare le patate con la buccia, partendo da acqua fredda, finché non saranno tenere; pelarle e tagliarle a tocchetti.", "Tagliare il polpo a pezzi e unirlo alle patate. Condire con un'emulsione di olio, succo di limone, prezzemolo tritato, sale e pepe.", "Lasciar insaporire almeno 30 minuti e servire tiepido o a temperatura ambiente."], "time": "1 ora e 50 minuti", "notes": [], "num": 20}, {"num": 21, "title": "Salmone al forno con verdure", "description": "Una delle preparazioni più semplici per iniziare a inserire il pesce nella nostra routine.\n\nIl forno permette di cucinare tutto insieme riducendo il tempo ai fornelli.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["2 tranci di salmone fresco (circa 300 g)", "2 zucchine", "150 g di pomodorini", "2 cucchiai di olio extravergine d'oliva", "½ limone", "origano o timo", "sale q.b."], "steps": ["Tagliare le zucchine a rondelle e i pomodorini a metà e disporli in una teglia con carta forno; condire con metà dell'olio e il sale.", "Cuocere le verdure in forno statico a 200°C (180°C se ventilato) per 10 minuti.", "Aggiungere i tranci di salmone, salarli, condirli con l'olio rimasto e le erbe e cuocere ancora 12-15 minuti.", "Servire con qualche goccia di limone."], "time": "35 minuti", "notes": [{"title": "Contorno consigliato", "level": 2, "text": "Patate al forno oppure insalata.", "items": []}]}, {"title": "Salmone al miele e limone", "description": "Un secondo di pesce veloce: la glassa al miele e limone rende il salmone lucido e leggermente caramellato.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["2 tranci di salmone (circa 300 g)", "1 cucchiaio di miele", "succo di ½ limone", "1 cucchiaio di olio extravergine d'oliva", "1 spicchio d'aglio", "prezzemolo tritato", "sale q.b.", "pepe nero q.b."], "steps": ["Mescolare il miele con il succo di limone, l'olio, l'aglio tritato, il sale e il pepe; far marinare i tranci in questa miscela per 15 minuti.", "Cuocere i tranci in una padella antiaderente, a fuoco medio, per 4 minuti per lato, versando l  "pesce al forno → insalata;", "gamberi → riso o cous cous."], "table": null}, {"title": "Consiglio del capitolo", "level": 1, "text": "Il pesce non deve diventare un impegno aggiuntivo.\n\nLa nostra strategia sarà semplice:\n\nCon questa impostazione il pesce può diventare una piacevole alternativa alla carne, mantenendo la semplicità che cerchiamo nella nostra cucina quotidiana.", "items": ["inserirlo una volta alla settimana quando possibile;", "scegliere prodotti freschi e facilmente gestibili;", "preferire ricette veloci;", "acquistare la quantità necessaria senza creare sprechi."], "table": null}]}, {"num": 7, "title": "Legumi e cucina vegetariana", "intro": [{"title": "Perché questo capitolo", "level": 2, "text": "I legumi rappresentano una delle alternative più semplici per variare la nostra alimentazione.\n\nSpesso vengono considerati un contorno, ma in realtà possono diventare il protagonista di un pasto completo, soprattutto se abbinati a verdure, uova, formaggi o cereali.\n\nL'obiettivo di questo capitolo non è sostituire completamente la carne, ma creare nuove abitudini:\n\nI legumi hanno inoltre un grande vantaggio pratico: possono essere acquistati già pronti e conservati in dispensa, diventando una soluzione ideale per le giornate più impegnative.", "items": ["inserire più varietà durante la settimana;", "ridurre la ripetizione delle stesse cene;", "scoprire piatti semplici e soddisfacenti."], "table": null}], "recipes": [{"title": "Asparagi con uovo al tegamino", "description": "Un piatto semplice e tradizionale: il tuorlo morbido condisce gli asparagi.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["500 g di asparagi", "2 uova", "30 g di parmigiano grattugiato", "1 noce di burro", "sale q.b.", "pepe nero q.b."], "steps": ["Lessare gli asparagi legati a mazzetto, in piedi, in acqua salata per 10-12 minuti; scolarli e disporli nei piatti.", "Sciogliere il burro in padella e cuocere le uova al tegamino, salandole.", "Adagiare un uovo su ciascun piatto e completare con parmigiano e pepe."], "time": "25 minuti", "notes": [], "stagioni": "P", "num": 1}, {"title": "Burger di ceci", "description": "Hamburger vegetariani di ceci, morbidi dentro e dorati fuori, da servire nel panino o con un'insalata.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["240 g di ceci già cotti (scolati)", "1 uovo", "40 g di pangrattato", "1 cucchiaio di prezzemolo tritato", "½ spicchio d'aglio", "2 cucchiai di olio extravergine d'oliva", "sale q.b."], "steps": ["Schiacciare i ceci con una forchetta o frullarli a impulsi, lasciandoli un po' grossolani.", "Unire l'uovo, il pangrattato, il prezzemolo, l'aglio tritato finemente e il sale, e mescolare fino a ottenere un composto compatto.", "Formare quattro burger e lasciarli riposare in frigorifero per 15 minuti.", "Cuocerli in padella con l'olio per 4 minuti per lato, oppure in forno statico a 200°C (180°C se ventilato) per 20 minuti, girandoli a metà cottura."], "time": "30 minuti", "notes": [], "num": 2}, {"num": 3, "title": "Caprese completa", "description": "Una versione più completa della classica mozzarella e pomodoro.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["2 mozzarelle (circa 250 g)", "300 g di pomodori maturi", "4 fette di pane casereccio", "basilico", "3 cucchiai di olio extravergine d'oliva", "origano", "sale q.b."], "steps": ["Tagliare mozzarelle e pomodori a fette e alternarle in un piatto con il basilico.", "Condire con olio, sale e origano.", "Tostare il pane e servirlo caldo, per raccogliere l'olio e il succo di pomodoro."], "time": "10 minuti", "notes": [], "stagioni": "PE"}, {"title": "Carciofi ripieni al forno", "description": "Carciofi con un ripieno di pangrattato, parmigiano e prezzemolo.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["4 carciofi", "50 g di pangrattato", "30 g di parmigiano grattugiato", "1 spicchio d'aglio", "prezzemolo ": []}, {"num": 7, "title": "Cous cous vegetariano completo", "description": "Un piatto versatile che può essere utilizzato sia come pranzo sia come cena leggera.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["160 g di cous cous", "200 ml di acqua bollente", "2 zucchine", "2 carote", "150 g di pomodorini", "1 mozzarella (125 g)", "3 cucchiai di olio extravergine d'oliva", "menta o basilico", "sale q.b."], "steps": ["Versare l'acqua bollente sul cous cous con un pizzico di sale e un cucchiaio d'olio, coprire per 5 minuti e sgranare con una forchetta.", "Tagliare zucchine e carote a cubetti e saltarle con l'olio per 10 minuti, salando.", "Unire pomodorini a metà e mozzarella a cubetti al cous cous.", "Aggiungere le verdure tiepide, mescolare e completare con le erbe."], "time": "25 minuti", "notes": []}, {"num": 8, "title": "Crepes di zucchine — la base jolly", "description": "Le crepes di zucchine sono una delle preparazioni più versatili della nostra cucina.\n\nLa base è sempre la stessa, ma può essere farcita in molti modi diversi. Questo permette di trasformare una semplice preparazione in tante cene differenti, scegliendo la farcitura in base a quello che abbiamo in frigorifero.\n\nSono particolarmente utili nelle giornate in cui vogliamo mangiare qualcosa di diverso dalla solita carne e verdure, senza però dedicare troppo tempo alla cucina.\n\nLa nostra combinazione preferita è formaggio spalmabile e salmone affumicato, ma le possibilità sono molte.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["2 zucchine", "2 uova", "140 g di farina", "160 ml di acqua", "olio extravergine d'oliva per la padella", "sale"], "steps": ["Grattugiare le zucchine e strizzarle bene per eliminare l'acqua in eccesso.", "Unire le uova, la farina e l'acqua.", "Aggiungere un pizzico di sale e mescolare fino a ottenere un composto omogeneo.", "Scaldare una padella antiaderente con pochissimo olio.", "Versare una parte del composto e distribuirlo formando una crepe sottile.", "Cuocere 2 minuti per lato, finché la crepe non sarà dorata.", "Ripetere fino a terminare il composto."], "time": "25 minuti circa", "notes": [{"title": "La base", "level": 2, "text": "", "items": []}, {"title": "Le nostre farciture", "level": 1, "text": "Una volta preparate le crepes, possiamo scegliere la farcitura in base ai nostri gusti e agli ingredienti disponibili.", "items": []}, {"title": "🥬 Vegetariane", "level": 2, "text": "", "items": []}, {"title": "Ricotta, spinaci e parmigiano", "level": 3, "text": "Una farcitura delicata e cremosa.\n\nOttima anche con qualche minuto di forno finale per gratinare leggermente la superficie.", "items": ["ricotta;", "spinaci;", "parmigiano."]}, {"title": "Stracchino, zucchine e parmigiano", "level": 3, "text": "Una combinazione molto cremosa che valorizza il sapore della zucchina.", "items": ["stracchino;", "zucchine precedentemente cotte;", "parmigiano."]}, {"title": "Ricotta, pomodorini e mozzarella", "level": 3, "text": "Una versione fresca e molto italiana.", "items": ["ricotta;", "pomodorini;", "mozzarella;", "basilico, se disponibile."]}, {"title": "Formaggio spalmabile, pomodori secchi e rucola", "level": 3, "text": "Più saporita delle precedenti, ma comunque molto semplice.", "items": ["formaggio spalmabile;", "pomodori secchi;", "rucola."]}, {"title": "🥩 Con carne", "level": 2, "text": "", "items": []}, {"title": "Prosciutto cotto e mozzarella", "level": 3, "text": "Una delle combinazioni più semplici e golose.\n\nPossiamo completare la cottura in forno per ottenere una farcitura filante.", "items": ["prosciutto cotto;", "mozzarella."]}, {"title": "Ricotta, prosciutto cotto e parmigiano", "level": 3, "text": "Più delicata e cremosa.", "items": ["ricotta;", "prosciutto cotto;", "parmigiano."]}, {"title": "Pollo, formaggio spalmabile e zucchine", "level": 3, "text": "Un'ottima soluzione per utilizzare eventuale pollo avanzato.", "items": ["pollo già cotto e sfilacciato;", "formaggio spalmabile;", "zucchine."]}, {"title": "Prosciutto cotto e scamorza", "level": 3, "text": "Una delle versioni più sfiziose.\n\nDopo aver farcito le crepes, passarle qualche minuto in forno per far sciogliere il formaggio.", "items": ["prosciutto cotto;", "scamorza."]}, {"title": "🐟 Con pesce", "level": 2, "text": "", "items": []}, {"title": "Formaggio spalmabile e salmone affumicato", "level": 3, "text": "La nostra combinazione preferita.\n\nUna volta farcite, le crepes possono essere servite direttamente oppure accompagnate da un'insalata.", "items": ["formaggio spalmabile;", "salmone affumicato."]}, {"title": "Ricotta, salmone affumicato e rucola", "level": 3, "text": "Una variante della nostra combinazione abituale, più fresca e leggermente più delicata.", "items": ["ricotta;", "salmone affumicato;", "rucola."]}, {"title": "Ricotta, tonno e pomodorini", "level": 3, "text": "Una soluzione pratica quando abbiamo poco tempo.\n\nÈ particolarmente utile perché possiamo tenere tonno e ricotta tra gli ingredienti jolly della cucina.", "items": ["ricotta;", "tonno;", "pomodorini."]}, {"title": "Formaggio spalmabile, gamberetti e zucchine", "level": 3, "text": "Una variante più particolare, da preparare quando abbiamo a disposizione gamberetti freschi.", "items": ["formaggio spalmabile;", "gamberetti;", "zucchine."]}, {"title": "Come completarle", "level": 1, "text": "Le crepes possono essere servite semplicemente dopo aver aggiunto la farcitura oppure possono essere ripiegate e passate qualche minuto in forno.\n\nLa seconda soluzione è particolarmente indicata per le farciture con mozzarella, scamorza, parmigiano e altri formaggi filanti.\n\nIn questo modo la stessa preparazione può diventare una cena veloce oppure un piatto leggermente più sfizioso.", "items": []}, {"title": "Il nostro principio", "level": 2, "text": "La crepe di zucchine diventa così una vera base jolly.\n\nNon dobbiamo necessariamente decidere in anticipo quale farcitura utilizzare: possiamo aprire il frigorifero e scegliere in base a ciò che abbiamo già a disposizione.\n\nUna sola preparazione può quindi diventare una cena vegetariana, una cena con carne, una cena con pesce, una soluzione per utilizzare gli avanzi o un piatto più sfizioso per il fine settimana.\n\nStessa base, tanti piatti diversi.", "items": []}], "stagioni": "E"}, {"title": "Crostoni con ricotta e verdure", "description": "Una cena veloce e leggera: pane tostato, ricotta cremosa e verdure fresche.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["4 fette di pane casereccio", "200 g di ricotta", "1 zucchina", "10 pomodorini", "olio extravergine d'oliva", "basilico", "sale e pepe"], "steps": ["Tagliare la zucchina a rondelle e saltarla in padella con un filo d'olio per 5-6 minuti, finché non sarà dorata. Salare.", "Tostare le fette di pane in padella o sulla piastra, 2 minuti per lato.", "Condire la ricotta con un filo d'olio, sale e pepe e spalmarla sui crostoni.", "Completare con le zucchine, i pomodorini tagliati a metà e qualche foglia di basilico."], "time": "20 minuti", "notes": [], "num": 9}, {"title": "Fagioli all'uccelletto", "description": "Un classico toscano: fagioli cannellini in umido con salvia, aglio e pomodoro.", "servingsLabel": "Ingredienti per 2 persone", "servings": 2, "ingredients": ["400 g di fagioli cannellini cotti", "2 spicchi d'aglio", "4-5 foglie di salvia", "200 g di passata di pomodoro", "olio extravergine d'oliva", "sale e pepe"], "steps": ["Scaldare l'olio in una padella con l'aglio schiacciato e la salvia.", "Aggiungere la passata di pomodoro e cuocere per 5 minuti.", "Unire i fagioli scolati, salare e pepare, poi cuocere a fuoco basso per 15-20 minuti, finché il sugo non si sarà ristretto."], "time": "30 minuti", "notes": [], "num": 10, "stagioni": "AI"}, {"title": "Falafel al forno", "description": "Polpettine di ceci speziate, croccanti fuori e morbide dentro: una versione più leggera dei falafel fritti.", "se escription": "Biscotti morbidi dentro e croccanti fuori, con tante gocce di cioccolato.", "servingsLabel": "Per circa 16 cookies", "servings": 6, "ingredients": ["200 g di farina 00", "100 g di burro morbido", "100 g di zucchero di canna", "1 uovo", "100 g di gocce di cioccolato", "½ cucchiaino di lievito per dolci", "1 pizzico di sale"], "steps": ["Lavorare il burro con lo zucchero, unire l'uovo.", "Aggiungere farina, lievito, sale e infine le gocce di cioccolato.", "Formare palline e disporle distanziate su una teglia con carta forno, schiacciandole leggermente.", "Cuocere in forno statico a 180°C (160°C se ventilato) per 12 minuti: devono restare morbidi al centro."], "time": "30 minuti", "notes": [], "num": 8}, {"title": "Crema al limone", "description": "Una crema fresca e profumata, ottima da sola o per farcire.", "servingsLabel": "Ingredienti per 4 persone", "servings": 4, "ingredients": ["500 ml di latte", "4 tuorli", "120 g di zucchero", "40 g di amido di mais", "scorza di 2 limoni (non trattati)"], "steps": ["Scaldare il latte con la scorza dei limoni.", "Montare i tuorli con lo zucchero e l'amido.", "Versare il latte filtrato sui tuorli, mescolando, quindi rimettere sul fuoco e cuocere a fiamma bassa finché la crema non si addensa.", "Versare in coppette e lasciare raffreddare in frigorifero."], "time": "30 minuti (più il raffreddamento)", "notes": [], "num": 9}, {"title": "Crêpes base 1-2-3", "description": "Una pastella di crêpes semplice e versatile, pronta in pochi minuti: perfetta sia per farciture dolci sia salate.", "servingsLabel": "Ingredienti per circa 4 crêpes", "servings": 4, "servingsUnit": "crêpes", "ingredients": ["80 g di farina (qualsiasi tipo)", "2 uova", "200 ml di latte", "1 cucchiaio di olio", "sale q.b."], "steps": ["Mescolare bene la farina, le uova e un cucchiaio di latte.", "Aggiungere l'olio, il sale e il latte restante.", "Mescolare ancora: la pastella deve restare piuttosto liquida, è normale.", "Ungere leggermente una padella dients": ["4 mele", "40 g di noci", "2 cucchiai di miele", "1 cucchiaino di cannella", "20 g di burro"], "steps": ["Lavare le mele ed eliminare il torsolo senza forare il fondo.", "Mescolare le noci tritate con il miele e la cannella e riempire il centro delle mele; aggiungere una noce di burro.", "Disporle in una pirofila con un dito d'acqua e cuocere in forno statico a 180°C (160°C se ventilato) per 35-40 minuti."], "time": "50 minuti", "notes": [], "stagioni": "A", "num": 14}, {"title": "Mousse al cioccolato", "description": "Una mousse soffice e intensa con soli tre ingredienti.", "servingsLabel": "Ingredienti per 4 persone", "servings": 4, "ingredients": ["200 g di cioccolato fondente", "4 uova freschissime", "40 g di zucchero"], "steps": ["Sciogliere il cioccolato a bagnomaria e lasciarlo intiepidire.", "Separare i tuorli dagli albumi; unire i tuorli al cioccolato.", "Montare gli albumi a neve con lo zucchero e incorporarli delicatamente, dal basso verso l'alto.", "Versare in coppette e lasciar rassodare in frigorifero per almeno 3 ore."], "time": "20 minuti (più 3 ore di riposo)", "notes": [], "num": 15}, {"title": "Muffin allo yogurt e mirtilli", "description": "Muffin soffici e leggeri, con mirtilli freschi o surgelati.", "servingsLabel": "Per circa 10 muffin", "servings": 6, "ingredients": ["250 g di farina 00", "125 g di yogurt bianco", "100 g di zucchero", "2 uova", "80 ml di olio di semi", "1 bustina di lievito per dolci", "150 g di mirtilli"], "steps": ["Sbattere le uova con lo zucchero, aggiungere yogurt e olio.", "Unire farina e lievito setacciati, poi i mirtilli.", "Riempire per due terzi 10-12 pirottini e cuocere in forno statico a 180°C (160°C se ventilato) per 22-25 minuti."], "time": "40 minuti", "notes": [], "num": 16}, {"num": 17, "title": "Pancake alla banana", "description": "Una colazione dolce e sostanziosa, perfetta anche per un brunch del weekend.", "servingsLabel": "Ingredienti per 4 persone", "servings": 4, "ingredients": ["4 banane mature", "4 uova", "300 g di farina", "240 ml di latte", "1 bustina di lievito per dolci", "un pizzico di sale"], "steps": ["Schiacciare le banane con una forchetta fino a ottenere una purea.", "Aggiungere le uova e mescolare bene.", "Versare il latte, unire la farina, il lievito e un pizzico di sale, mescolando fino a ottenere un composto omogeneo e senza grumi.", "Scaldare una padella antiaderente e versare un mestolo di composto per ogni pancake; cuocere 2-3 minuti per lato, finché non si formano bollicine in superficie, poi girare.", "Servire caldi, anche con miele, sciroppo d'acero o frutta fresca."], "time": "25 minuti", "notes": []}, {"title": "Panna cotta", "description": "Un dolce al cucchiaio elegante e velocissimo da preparare, perfetto anche il giorno prima.", "servingsLabel": "Ingredienti per 4 persone", "servings": 4, "ingredients": ["500 ml di panna fresca", "100 g di zucchero", "6 g di gelatina in fogli (circa 3 fogli)", "1 bacca di vaniglia (o estratto)", "frutti di bosco o caramello per accompagnare"], "steps": ["Mettere i fogli di gelatina in ammollo in acqua fredda per 10 minuti.", "Scaldare la panna con lo zucchero e i semi di vaniglia, senza farla bollire.", "Strizzare la gelatina e scioglierla nella panna calda, mescolando bene finché non sarà ben amalgamata.", "Versare nelle coppette e lasciar raffreddare a temperatura ambiente, poi in frigorifero per almeno 4 ore.", "Servire con frutti di bosco freschi o una colata di caramello."], "time": "20 minuti (più il riposo in frigo)", "notes": [], "num": 18}, {"title": "Panna cotta alle fragole", "description": "Il classico dolce al cucchiaio con una salsa fresca di fragole.", "servingsLabel": "Ingredienti per 4 persone", "servings": 4, "ingredients": ["500 ml di panna fresca", "60 g di zucchero", "6 g di gelatina in fogli", "1 bacca di vaniglia o 1 cucchiaino di estratto", "250 g di fragole", "1 cucchiaio di zucchero per la salsa"], "steps": ["Ammollare la gelatina in acqua fredda per 10 minuti.", "Scaldare la panna con lo zucchero e la vaniglia senza farla bollire; sciogliervi la gelatina strizzata.", "Versare in 4 stampini o bicchieri e lasciar rapprendere in frigorifero per almeno 4 ore.", "Frullare le fragole con lo zucchero e servire la salsa sulla panna cotta."], "time": "20 minuti (più 4 ore di riposo)", "notes": [], "stagioni": "P", "num": 19}, {"title": "Pasta frolla per mezzelune o crostata", "description": "Un impasto base versatile: lo stesso procedimento serve sia per delle mezzelune ripiene da inzuppare nel latte, sia per una classica crostata con marmellata.", "servingsLabel": "Ingredienti per circa 20 mezzelune (o una crostata)", "servings": 8, "ingredients": ["1 uovo", "125 g di zucchero", "un pizzico di sale", "250 g di farina 00", "vanillina", "100-125 g di burro a temperatura ambiente", "1 cucchiaino e mezzo di lievito per dolci", "marmellata o crema di cioccolato per farcire"], "steps": ["Mescolare con una frusta l'uovo, lo zucchero e il pizzico di sale.", "Setacciare insieme la farina, la vanillina e il lievito, poi unirli al composto mescolando un po' con un cucchiaio.", "Aggiungere il burro a pezzi e amalgamare con le mani fino a ottenere un composto omogeneo.", "Formare una palla, avvolgerla e lasciarla riposare in frigorifero per 30 minuti.", "Stendere l'impasto con il mattarello a circa mezzo centimetro di spessore e ricavare dei cerchi con uno stampo.", "Mettere un po' di marmellata o cioccolata al centro di ogni cerchio, chiudere a mezzaluna e disporre su una teglia foderata di carta forno.", "Cuocere in forno statico, in posizione centrale, a 180°C (160°C se ventilato) per 20-25 minuti, finché non saranno dorate (attenzione a non farle scurire troppo)."], "time": "1 ora (più il riposo in frigo)", "notes": [{"title": "Variante crostata", "level": 1, "text": "Al posto delle mezzelune: prendere dal frigo 2/3 dell'impasto e stenderlo con le mani direttamente in una teglia foderata di carta forno. Farcire con marmellata (o crema di cioccolato). Con la pasta restante formare delle striscioline e disporle sopra a reticolo. Cuocere in forno statico, a metà altezza, a 180°C (160°C se ventilato) per 30-40 minuti, controllando che la superficie non scurisca troppo: deve risultare appena dorata.", "items": []}], "num": 20}, {"title": "Pesche al forno con amaretti", "description": "Un dolce estivo semplice: le pesche si ammorbidiscono in forno con un ripieno croccante.", "servingsLabel": "Ingredienti per 4 persone", "servings": 4, "ingredients": ["4 pesche mature ma sode", "8 amaretti", "2 cucchiai di zucchero", "20 g di burro", "1 cucchiaio di cacao amaro (facoltativo)"], "steps": ["Tagliare le pesche a metà, eliminare il nocciolo e scavare un po' di polpa.", "Tritare la polpa scavata e mescolarla con gli amaretti sbriciolati, lo zucchero e il cacao.", "Riempire le pesche con il composto, aggiungere una noce di burro su ciascuna e disporle in una teglia.", "Cuocere in forno statico a 180°C (160°C se ventilato) per 25-30 minuti."], "time": "40 minuti", "notes": [], "stagioni": "E", "num": 21}, {"title": "Plumcake allo yogurt e limone", "description": "Un dolce da colazione soffice e profumato, che si prepara con il vasetto dello yogurt.", "servingsLabel": "Per uno stampo da plumcake", "servings": 6, "ingredients": ["1 vasetto di yogurt bianco (125 g)", "2 vasetti di zucchero", "3 vasetti di farina 00", "3 uova", "½ vasetto di olio di semi", "1 bustina di lievito", "scorza di 1 limone"], "steps": ["Mescolare yogurt, zucchero, uova, olio e scorza.", "Unire farina e lievito setacciati.", "Versare in uno stampo da plumcake imburrato e cuocere in forno statico a 180°C (160°C se ventilato) per 45 minuti."], "time": "1 ora", "notes": [], "num": 22}, {"num": 23, "title": "Pogaça in maglia al cioccolato cremoso", "description": "Una pasta lievitata turca, morbida e intrecciata a mano, con un cuore di cioccolato cremoso: spettacolare da vedere e ancora più buona da mangiare.", "servingsLabel": "Ingredienti per 12 pezzi", "servings": 12, "ingredients": ["500 g di farina", "250 ml di latte", "80 ml di olio di semi", "11 g di lievito di birra secco (o circa 30 g di lievito fresco)", "20 g di zucchero", "12 g di sale", "1 tuorlo d'uovo (per spennellare)", "cioccolato cremoso spalmabile q.b."], "steps": ["Versare la farina in una ciotola capiente e formare una fontana al centro.", "Nella fontana versare il lievito e lo zucchero, e scioglierli mescolando con il latte tiepido.", "Aggiungere l'olio, il sale e la farina restante, impastando fino a ottenere un composto morbido ed elastico che non si attacca alle mani (regolare con un po' di farina o di latte se serve).", "Coprire l'impasto e lasciare lievitare fino al raddoppio del volume (circa 1 ora).", "Dividere l'impasto in 12 pezzi uguali. Stendere ogni pezzo in un rettangolo di circa 19x19 cm e spalmarlo con il cioccolato cremoso.", "Tagliare ogni rettangolo a listarelle e intrecciarle a treccia, arrotolando le estremità verso il centro per formare la caratteristica \"maglia\".", "Disporre le pogaça su una teglia foderata e lasciare lievitare una seconda volta fino al raddoppio (circa 40 minuti).", "Spennellare la superficie con il tuorlo d'uovo.", "Cuocere in forno statico a 180°C (160°C se ventilato) fino a quando la superficie non sarà ben dorata, circa 20-25 minuti."], "time": "3 ore (comprese le lievitazioni)", "notes": [{"title": "Nota", "level": 1, "text": "L'intreccio a treccia richiede un po' di pratica: anche una forma più semplice, arrotolata a chiocciola, funziona bene.", "items": []}, {"title": "Variante veloce con pasta sfoglia", "level": 1, "text": "L'impasto originale è una pasta lievitata (morbida, simile al pane), non una pasta sfoglia: usare della pasta sfoglia pronta cambia il risultato, ma è un'ottima scorciatoia. In quel caso saltare la lievitazione: srotolare 2-3 rotoli di pasta sfoglia già pronta, tagliarla a listarelle, spalmare con il cioccolato cremoso e intrecciare come da ricetta. Spennellare con il tuorlo e cuocere in forno statico a 200°C (180°C se ventilato) per 15-20 minuti, finché non sarà dorata e gonfia.", "items": []}], "servingsUnit": "pezzi"}, {"title": "Salame di cioccolato", "description": "Un dolce senza cottura, con biscotti secchi e cioccolato.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["200 g di biscotti secchi", "100 g di cioccolato fondente", "80 g di burro", "2 cucchiai di zucchero", "1 uovo (facoltativo, solo pastorizzato)", "zucchero a velo q.b."], "steps": ["Sciogliere cioccolato e burro a bagnomaria; unire lo zucchero, lasciar intiepidire e incorporare l'uovo pastorizzato, se lo si usa.", "Frantumare i biscotti grossolanamente e mescolarli al cioccolato.", "Formare un rotolo su carta forno e lasciarlo rassodare in frigorifero per 3 ore.", "Spolverare con zucchero a velo e tagliare a fette."], "time": "20 minuti (più 3 ore di riposo)", "notes": [], "num": 24}, {"title": "Schiacciata all'uva", "description": "Il dolce toscano della vendemmia: pasta soffice con tanta uva da vino.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["500 g di farina 00", "300 ml di acqua tiepida", "1 cubetto di lievito di birra (25 g)", "50 g di zucchero per l'impasto (più 3 cucchiai per coprire)", "700 g di uva nera da vino", "3 cucchiai di olio extravergine d'oliva", "1 pizzico di sale"], "steps": ["Sciogliere il lievito nell'acqua, aggiungere la farina, i 50 g di zucchero, l'olio e il sale e impastare; coprire e far lievitare per 1 ora.", "Dividere l'impasto in due parti; stenderne una in una teglia di circa 30x40 cm oliata, coprirla con metà dell'uva e metà dello zucchero per coprire.", "Stendere sopra la seconda parte, coprire con l'uva rimasta e il resto dello zucchero e far lievitare ancora 30 minuti.", "Cuocere in forno statico a 200°C (180°C se ventilato) per 35 minuti."], "time": "2 ore e 15 minuti (compresa la lievitazione)", "notes": [], "stagioni": "A", "num": 25}, {"title": "Semifreddo al limone", "description": "Un dolce fresco, senza gelatiera, da tenere nel freezer.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["3 uova freschissime", "100 g di zucchero", "250 ml di panna fresca", "succo e scorza di 2 limoni non trattati", "100 g di biscotti secchi"], "steps": ["Montare i tuorli con metà dello zucchero, unire il succo e la scorza di limone.", "Montare gli albumi a neve con lo zucchero rimasto e la panna a parte; incorporare delicatamente le due masse ai tuorli.", "Foderare uno stampo da plumcake con pellicola e distribuire sul fondo i biscotti sbriciolati; versare la crema.", "Lasciar rassodare in freezer per almeno 6 ore e servire a fette."], "time": "30 minuti (più 6 ore di freezer)", "notes": [], "stagioni": "E", "num": 26}, {"title": "Tiramisù", "description": "Il dolce al cucchiaio italiano per eccellenza: savoiardi al caffè e crema al mascarpone, da preparare con un po' di anticipo.", "servingsLabel": "Ingredienti per 4 persone", "servings": 4, "ingredients": ["250 g di mascarpone", "2 uova", "50 g di zucchero", "150 g di savoiardi", "150 ml di caffè freddo", "cacao amaro in polvere q.b."], "steps": ["Preparare il caffè e lasciarlo raffreddare.", "Separare i tuorli dagli albumi. Montare i tuorli con lo zucchero fino a ottenere una crema chiara e spumosa.", "Aggiungere il mascarpone ai tuorli montati, poco alla volta, mescolando delicatamente dal basso verso l'alto.", "Montare a neve gli albumi e incorporarli delicatamente alla crema di mascarpone.", "Inzuppare velocemente i savoiardi nel caffè freddo, senza farli inzuppare troppo, e disporli sul fondo di una pirofila.", "Coprire con uno strato di crema, poi un altro strato di savoiardi inzuppati e l'ultima crema in superficie.", "Spolverare con abbondante cacao amaro e lasciare riposare in frigorifero per almeno 3-4 ore, meglio se una notte intera."], "time": "30 minuti (più il riposo in frigo)", "notes": [{"title": "Nota", "level": 1, "text": "Usando uova crude, sceglierle molto fresche. Il tiramisù è ancora più buono preparato il giorno prima.", "items": []}], "num": 27}, {"num": 28, "title": "Torta agli amaretti", "description": "Una torta della tradizione con un cuore morbido di ricotta e amaretti sbriciolati, chiusa in un guscio di pasta frolla fatta in casa.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["300 g di farina (per la pasta)", "150 g di zucchero (per la pasta)", "150 g di burro a temperatura ambiente", "1 uovo (per la pasta)", "1 bustina di lievito per dolci", "un pizzico di sale", "aroma di vaniglia", "250 g di ricotta", "100 g di zucchero (per la crema)", "1 uovo (per la crema)", "100 g di amaretti sbriciolati", "gocce di cioccolato q.b.", "aromi a piacere"], "steps": ["Per la pasta, mescolare lo zucchero con l'uovo, poi aggiungere la farina, il lievito e il sale, mescolando bene.", "Unire il burro a pezzetti e l'aroma di vaniglia, lavorando fino a formare una palla omogenea.", "Per la crema, mescolare l'uovo con lo zucchero, poi aggiungere la ricotta, gli amaretti sbriciolati, le gocce di cioccolato e gli aromi.", "Stendere circa 3/4 della pasta sul fondo di una teglia da 24 cm imburrata, versare la crema e livellarla.", "Sbriciolare a pezzetti la pasta rimasta e distribuirla sopra la crema, coprendo la superficie.", "Cuocere in forno statico a 180°C (160°C se ventilato) per 45 minuti, finché la superficie non sarà dorata."], "time": "1 ora e 15 minuti", "notes": []}, {"title": "Torta al cioccolato", "description": "Una torta densa e golosa, con un cuore morbido: per gli amanti del cioccolato.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["200 g di cioccolato fondente", "150 g di burro", "150 g di zucchero", "4 uova", "80 g di farina", "un pizzico di sale", "zucchero a velo per decorare"], "steps": ["Sciogliere il cioccolato fondente con il burro a bagnomaria o al microonde, mescolando fino a un composto liscio.", "Montare le uova con lo zucchero fino a renderle chiare e spumose.", "Incorporare il cioccolato fuso alle uova montate, mescolando delicatamente dal basso verso l'alto.", "Aggiungere la farina setacciata e il sale, amalgamando senza smontare il composto.", "Versare in una tortiera da 22 cm imburrata e infarinata e cuocere in forno statico a 180°C (160°C se ventilato) per 25-30 minuti: il centro deve restare leggermente umido.", "Lasciar raffreddare prima di sformare e spolverare con zucchero a velo."], "time": "50 minuti", "notes": [], "num": 29}, {"title": "Torta all'arancia", "description": "Una torta soffice con arancia intera frullata, profumatissima.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["1 arancia non trattata", "3 uova", "200 g di zucchero", "250 g di farina 00", "100 ml di olio di semi", "1 bustina di lievito"], "steps": ["Lavare l'arancia, tagliarla a pezzi senza semi e frullarla con tutta la buccia.", "Montare le uova con lo zucchero, aggiungere l'olio e l'arancia frullata.", "Unire farina e lievito setacciati.", "Versare in uno stampo da 22 cm imburrato e cuocere in forno statico a 180°C (160°C se ventilato) per 40-45 minuti."], "time": "1 ora", "notes": [], "num": 30, "stagioni": "I"}, {"title": "Torta allo yogurt e fragole", "description": "Una torta soffice e profumata, con fragole fresche tra l'impasto.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["250 g di fragole", "200 g di farina 00", "125 g di yogurt bianco", "150 g di zucchero", "3 uova", "80 ml di olio di semi", "1 bustina di lievito per dolci"], "steps": ["Montare le uova con lo zucchero, aggiungere yogurt e olio.", "Unire farina e lievito setacciati e, per ultime, due terzi delle fragole a pezzetti.", "Versare in uno stampo da 22 cm foderato e distribuire sopra le fragole rimaste.", "Cuocere in forno statico a 180°C (160°C se ventilato) per 40-45 minuti."], "time": "1 ora", "notes": [], "stagioni": "P", "num": 31}, {"title": "Torta di carote", "description": "Una torta umida e profumata, con mandorle e carote.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["250 g di carote", "150 g di mandorle in polvere", "3 uova", "150 g di zucchero", "100 g di farina", "50 ml di olio di semi", "1 bustina di lievito", "scorza di 1 limone"], "steps": ["Grattugiare finemente le carote.", "Montare uova e zucchero; unire olio, scorza, carote e mandorle.", "Incorporare farina e lievito setacciati.", "Versare in uno stampo da 22 cm foderato e cuocere in forno statico a 180°C (160°C se ventilato) per 40 minuti."], "time": "1 ora", "notes": [], "num": 32, "stagioni": "A"}, {"title": "Torta di mele", "description": "Un grande classico della pasticceria casalinga: soffice, profumata, perfetta per la colazione o la merenda.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["300 g di farina", "3 mele", "200 g di zucchero", "3 uova", "70 g di burro morbido (o olio di semi)", "200 ml di latte", "1 bustina di lievito per dolci", "scorza di 1 limone", "un pizzico di sale"], "steps": ["Sbucciare le mele, tagliarne due a cubetti piccoli e una a fettine sottili per decorare la superficie.", "Montare le uova con lo zucchero fino a ottenere un composto chiaro e spumoso.", "Aggiungere il burro morbido (o l'olio) e la scorza di limone, continuando a mescolare.", "Unire il latte, poi la farina setacciata con il lievito e il sale, mescolando fino a ottenere un impasto omogeneo.", "Incorporare le mele a cubetti e versare il composto in una tortiera da 24 cm imburrata e infarinata.", "Decorare la superficie con le fettine di mela rimaste.", "Cuocere in forno statico a 180°C (160°C se ventilato) per 40 minuti, verificando la cottura con uno stecchino."], "time": "1 ora", "notes": [], "num": 33, "stagioni": "A"}, {"title": "Torta di ricotta e pere", "description": "Una torta soffice e delicata che si scioglie in bocca.", "servingsLabel": "Ingredienti per 8 persone", "servings": 8, "ingredients": ["250 g di ricotta", "2 pere", "3 uova", "150 g di zucchero", "150 g di farina 00", "½ bustina di lievito", "scorza di limone"], "steps": ["Mescolare ricotta, uova e zucchero con la scorza.", "Unire farina e lievito setacciati; aggiungere una pera a cubetti.", "Versare in uno stampo da 22 cm foderato, distribuire sopra l'altra pera a fettine.", "Cuocere in forno statico a 180°C (160°C se ventilato) per 40-45 minuti."], "time": "1 ora", "notes": [], "num": 34, "stagioni": "A"}], "closing": []}]}</script>
<script>(function(){
"use strict";

var DATA = JSON.parse(document.getElementById('data').textContent);
var CHAPTERS = DATA.chapters;

/* ---------- versione app ---------- */
var APP_VERSION = '2.0.0';
var VERSION_LOG = [
  {v:'2.0.0', note:'Nuova versione ufficiale: rebranding \u201cCucina serale\u201d con logo “tavola apparecchiata”, titoli in Cormorant, sfumature che cambiano con la stagione e tema scuro o avorio. Barra in basso (Ricette, Piano, Spesa, Frigo, Io), nuova home con la card \u201cStasera\u201d (il piatto del piano di oggi o un\u2019idea di stagione), dado animato per \u201cSorprendimi\u201d che chiede se vuoi un primo o un secondo (il secondo arriva con un contorno in accompagnamento), copertine per ogni capitolo, icone nuove al posto delle emoji, illustrazioni per le ricette senza foto e nuova schermata iniziale animata. Nuova pagina \u201cIo\u201d con i Preferiti, le tue ricette, il quaderno e le impostazioni. Nuova sezione \u201cFamiglia\u201d: accedi con email e password, crea la famiglia o entra con un codice invito e condividi tra pi\u00f9 telefoni il piano settimanale, la lista della spesa, i preferiti, la dispensa, il quaderno e le note. Slogan: Cosa mangiamo stasera?'},
  {v:'1.32.0', note:'Revisione completa delle 310 ricette: corrette dosi, ingredienti dimenticati o inutilizzati, tempi totali (compresi riposi, lievitazioni e raffreddamenti), temperature del forno con il valore per il ventilato e passaggi in ordine sbagliato in 114 ricette; tolto il peperoncino da amatriciana, puttanesca, aglio olio e tonno, broccoli e tacos. L\u2019interruttore \u201cEvita piatti a base di maiale\u201d ora riguarda solo la carne di maiale: pancetta, guanciale e prosciutto come condimento sono ammessi e segnalati con \u201cContiene salumi\u201d.'},
  {v:'1.31.0', note:'Altre 48 ricette di stagione (310 in totale): ora ci sono almeno 25 piatti specifici per ogni stagione (primavera 26, estate 58, autunno 25, inverno 25), oltre ai piatti adatti a pi\u00f9 stagioni e a quelli di tutto l\u2019anno. Novit\u00e0 di primavera: asparagi, carciofi, piselli, fave, fragole e agnello. Estate: panzanella, gazpacho, caponata, semifreddo al limone. Autunno: funghi porcini, zucca, polenta, castagnaccio, schiacciata all\u2019uva. Inverno: broccoli, cavolfiore, verza, cavolo nero, pollo alle arance.'},
  {v:'1.30.0', note:'Piatti di stagione: 90 ricette sono ora segnate come primaverili-estive o autunnali-invernali (con un\u2019etichetta nella scheda) e il piano automatico e \u201cSorprendimi\u201d preferiscono quelli adatti al periodo; l\u2019interruttore \u201cPreferisci i piatti di stagione\u201d si trova nel piano e nelle impostazioni. Riscritte con dosi e passaggi completi 43 ricette che erano troppo sintetiche (cous cous, farro, pasta e legumi, molti secondi di pollo, pesce e vegetariani).'},
  {v:'1.29.0', note:'Altre 25 ricette (262 in totale): antipasti da 12 a 24 (arancini al forno, crostini, mini quiche, olive all\u2019ascolana, rotolo di frittata, verdure grigliate marinate e altri) e dolci da 13 a 26 (cheesecake allo yogurt, mousse al cioccolato, torta all\u2019arancia, torta di carote, cookies, muffin, clafoutis e altri).'},
  {v:'1.28.0', note:'Altre 28 ricette (237 in totale): pesce da 15 a 28 (baccal\u00e0 alla livornese, branzino al sale, zuppa di pesce, sarde al forno, seppie con piselli, spiedini di gamberi e altre) e legumi e vegetariano da 21 a 36 (parmigiana di melanzane, burger di ceci, mozzarella in carrozza, sformato di spinaci, zuppe e vellutate di legumi, uova al forno e altre).'},
  {v:'1.27.0', note:'Altre 23 ricette di carne (209 in totale): carne rossa da 12 a 27 (brasato, roast beef, vitello tonnato, gulasch, tagliata, agnello al forno e altre) e carne bianca da 19 a 27 (tacchino e coniglio). Il piano settimanale automatico ora evita le ricette delle ultime due settimane (dopo aver usato \u201cCancella tutto il piano\u201d), non ripete nulla nella stessa settimana e bilancia i secondi (almeno un pesce e un vegetariano, al massimo due carni rosse e due bianche). Nuovo interruttore \u201cEvita piatti a base di maiale\u201d, attivo di default: li esclude dal piano automatico e da \u201cSorprendimi\u201d. Le ricette con maiale o salumi sono segnalate nella scheda.'},
  {v:'1.26.0', note:'Il libro cresce: +53 ricette (186 in totale). Contorni da 16 a 40 (asparagi, carciofi, cavolo nero, zucchine alla scapece, purè di zucca e altri) e primi da 25 a 54 (gnocchi, risotti, zuppe e minestre, cannelloni, lasagne vegetariane, spaghetti alle vongole e altri). Preferiti, note e piano settimanale restano agganciati alle ricette giuste anche se i numeri cambiano. Le foto ora si chiamano come la ricetta (es. spaghetti-alla-carbonara.jpg), cos\u00ec aggiungere nuove ricette non le sposta pi\u00f9.'},
  {v:'1.25.0', note:'Le ricette senza foto ora mostrano un\u2019illustrazione colorata con l\u2019icona del piatto (e le liste hanno un\u2019icona per ogni ricetta). La ricerca perdona i refusi e le differenze singolare/plurale (es. \u201cspagheti\u201d, \u201czucchina\u201d) e, se non trova risultati esatti, propone ricette simili. \u201cSvuota il frigo\u201d ora mostra prima le ricette che usano tutti gli ingredienti selezionati; sotto, quelle che ne usano solo una parte, con indicato cosa manca. Le foto in cartella ora vengono trovate anche se il file termina in .JPEG o .PNG (prima solo .jpg).'},
  {v:'1.24.0', note:'Corretto un bug per cui il backup non salvava correttamente piano, dispensa e lista della spesa. Aggiunto il "quaderno delle idee" per appuntare ricette viste altrove prima di deciderne l\u2019inserimento. Aggiunta la ricetta di famiglia per mezzelune/crostata. Suono del timer pi\u00f9 gradevole. Le notifiche per i timer ora si attivano con un avviso al primo avvio, invece che solo dalle Impostazioni. Nel piano settimanale si pu\u00f2 scrivere un desiderio libero se la ricetta non \u00e8 nel libro, e toccando un pasto gi\u00e0 assegnato si va dritti alla ricetta. Nella lista della spesa le quantit\u00e0 dello stesso prodotto ora si sommano, e viene indicata la ricetta di provenienza.'},
  {v:'1.23.0', note:'Rimosso il tasto "Stampa" dalla ricetta: su iPhone, quando l\u2019app \u00e8 installata sulla schermata Home, non apriva correttamente il foglio di stampa. Aggiunte le notifiche per i timer (in Impostazioni): quando un timer finisce, oltre al suono nell\u2019app arriva un avviso di sistema, utile se nel frattempo si guarda altro sul telefono.'},
  {v:'1.22.0', note:'Si possono avviare pi\u00f9 timer insieme (fino a 4), e il tempo rimanente si ricalcola da solo se lo schermo si spegne o si esce un attimo dall\u2019app (il suono per\u00f2 parte solo quando si riapre). Aggiunta la navigazione tra la ricetta precedente e successiva dello stesso capitolo. Nel piano settimanale, un nuovo riepilogo mostra l\u2019equilibrio tra le categorie della settimana (es. quante volte carne, pesce, legumi).'},
  {v:'1.21.0', note:'Il libro \u00e8 stato riordinato in una sequenza logica: Filosofia, Antipasti e salati, Primi, Carne bianca, Carne rossa, Pesce, Legumi, Contorni, Dolci. Aggiunto il nuovo capitolo Antipasti e salati (12 ricette, incluse due torte salate). Corretta e migliorata la pasta al salmone (era duplicata in due capitoli). Nel piano settimanale la cena ora ha una riga separata per il contorno, che scompare automaticamente se quella sera si esce o si sgarra (evidenziata con un colore diverso).'},
  {v:'1.20.0', note:'Carne rossa si arricchisce di 6 ricette: spezzatino di manzo, bistecca in padella, arrosto di manzo, involtini di manzo, chili con carne e straccetti di manzo con rucola. Ora il capitolo copre tecniche diverse, non solo carne macinata.'},
  {v:'1.19.0', note:'Il capitolo Dolci si arricchisce con tre classici: tiramisù, torta di mele e budino al cioccolato.'},
  {v:'1.18.0', note:'Aggiunto il capitolo Contorni con 7 ricette (patate al forno, purè, zucchine trifolate, insalata mista, carote glassate, melanzane a funghetto, verdure grigliate). Nel piano settimanale, ora puoi segnare un pasto come "Usciamo a mangiare fuori" o "Sgarro / pizza in compagnia" invece di assegnargli una ricetta. Aggiunto un pulsante per stampare la singola ricetta.'},

/* ---------- helpers ---------- */
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function normalize(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function withBr(text){
  return esc(text).split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
}
function paraHtml(text){
  if(!text) return '';
  return text.split(/\n\n+/).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
}
function listHtml(items){
  if(!items || !items.length) return '';
  return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';
}
function tableHtml(t){
  if(!t || !t.rows || !t.rows.length) return '';
  var rows = t.rows;
  var head = rows[0], body = rows.slice(1);
  var h = '<table><thead><tr>'+head.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  body.forEach(function(r){
    h += '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';
  });
  h += '</tbody></table>';
  return h;
}

/* ---------- ingredient quantity scaling ---------- */
var NUM_RE = /^(\d+(?:[.,]\d+)?)(?:\s*-\s*\d+(?:[.,]\d+)?)?\s*(.*)$/;
function fmtNum(n){
  var r = Math.round(n*2)/2; // nearest 0.5
  if(Math.abs(r - Math.round(r)) < 0.01) return String(Math.round(r));
  return String(r).replace('.', ',');
}
function scaleIngredientText(text, factor){
  if(factor === 1) return {amt:null, rest:text};
  var m = NUM_RE.exec(text);
  if(!m) return {amt:null, rest:text};
  var num = parseFloat(m[1].replace(',', '.'));
  var scaled = num * factor;
  return {amt: fmtNum(scaled), rest: m[2]};
}
function ingredientHtml(text, factor){
  var m = NUM_RE.exec(text);
  if(!m){ return '<span class="txt">'+esc(text)+'</span>'; }
  var num = parseFloat(m[1].replace(',', '.'));
  var newNum = factor === 1 ? m[1] : fmtNum(num*factor);
  return '<span class="txt"><span class="amt">'+esc(newNum)+'</span> '+esc(m[2])+'</span>';
}

function applyNumMigrations(){
  var verKey = function(id){ return id.split('.').map(Number); };
  NUM_MIGRATIONS.sort(function(a,b){ var x=verKey(a.id), y=verKey(b.id); for(var i=0;i<3;i++){ if(x[i]!==y[i]) return x[i]-y[i]; } return 0; });
  var applied = [];
  try{ applied = JSON.parse(lsGet(LS_NUMIG) || '[]') || []; if(!Array.isArray(applied)) applied = []; }catch(e){ applied = []; }
  var changed = false;
  NUM_MIGRATIONS.forEach(function(mig){
    if(applied.indexOf(mig.id) !== -1) return;
    function mapNum(cn, rn){
      var m = mig.map[String(cn)];
      if(!m) return rn;
      var v = m[String(rn)];
      return v === undefined ? rn : v;
    }
    function mapKey(k){
      var parts = String(k).split('-');
      if(parts.length !== 2) return k;
      var cn = parseInt(parts[0], 10), rn = parseInt(parts[1], 10);
      if(isNaN(cn) || isNaN(rn)) return k;
      return cn + '-' + mapNum(cn, rn);
    }
    function rewriteJson(lsKey, fn){
      var raw = lsGet(lsKey);
      if(!raw) return;
      try{ lsSet(lsKey, JSON.stringify(fn(JSON.parse(raw)))); }catch(e){}
    }
    rewriteJson('ricettario_favorites_v1', function(arr){ return (arr || []).map(mapKey); });
    rewriteJson('ricettario_note_v1', function(obj){
      var out = {};
      Object.keys(obj || {}).forEach(function(k){ out[mapKey(k)] = obj[k]; });
      return out;
    });
    rewriteJson('ricettario_piano_v1', function(obj){
      Object.keys(obj || {}).forEach(function(slot){
        var a = obj[slot];
        if(a && typeof a.cnum === 'number' && typeof a.rnum === 'number') a.rnum = mapNum(a.cnum, a.rnum);
      });
      return obj;
    });
    rewriteJson('ricettario_piano_storico_v1', function(arr){
      return (arr || []).map(function(keys){ return (keys || []).map(mapKey); });
    });
    rewriteJson('ricettario_recents_v1', function(arr){
      return (arr || []).map(function(r){
        return (r && typeof r.cnum === 'number') ? {cnum:r.cnum, rnum:mapNum(r.cnum, r.rnum)} : r;
      });
    });
    applied.push(mig.id);
    changed = true;
  });
  if(changed) lsSet(LS_NUMIG, JSON.stringify(applied));
}

/* ---------- servings override (session only) ---------- */
var servingsOverride = {};
function currentServings(r, key){
  if(servingsOverride[key] !== undefined) return servingsOverride[key];
  return r.servings || null;
}
function setServings(cn, rn, delta, ev){
  if(ev) ev.stopPropagation();
  var found = recipeByNums(cn, rn);
  if(!found) return;
  var r = found.recipe;
  var key = favKey(cn, rn);
  var base = r.servings || 1;
  var cur = currentServings(r, key) || base;
  var next = cur + delta;
  if(next < 1) next = 1;
  if(next > 20) next = 20;
  servingsOverride[key] = next;
  render();
}

   (export/ripristino), tutte le chiavi sono gi\u00e0 state assegnate. */
function getBackupKeys(){
  return [LS_FAV, LS_MINE, LS_NOTES, LS_PIANO, LS_SPESA, LS_DISPENSA, LS_THEME, LS_QUADERNO, LS_NUMIG, LS_NOPORK, LS_STORICO, LS_STAGIONE];

window.exportBackup = function(){
  var data = {};
  getBackupKeys().forEach(function(k){ var v = lsGet(k); if(v !== null) data[k] = v; });
  var blob = new Blob([JSON.stringify(data, null, 1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  a.href = url;
  a.download = 'ricettario-backup-'+d.toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
};
window.importBackupFile = function(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!confirm('Questo sostituir\u00e0 preferiti, note, piano, dispensa e ricette proprie salvate su questo telefono con quelle del file. Continuare?')) return;
      getBackupKeys().forEach(function(k){
        if(data[k] !== undefined) lsSet(k, data[k]); else lsRemove(k);
      });
      alert('Dati ripristinati. L\'app si ricarica ora.');
      location.reload();
    }catch(e){
      alert('Il file non sembra un backup valido di questa app.');
    }
  };
  reader.readAsText(file);
};

/* ---------- condividi ricetta ---------- */
function recipeShareText(r){
  var lines = [r.title, ''];
  if(r.description) lines.push(r.description, '');
  lines.push('Ingredienti:');
  r.ingredients.forEach(function(i){ lines.push('- '+i); });
  lines.push('', 'Preparazione:');
  r.steps.forEach(function(s,i){ lines.push((i+1)+'. '+s); });
  return lines.join('\n');
}
window.shareRecipe = function(cnum, rnum){
  var found = recipeByNums(cnum, rnum);
  if(!found) return;
  var text = recipeShareText(found.recipe);
  var url = location.href.split('#')[0] + '#/c/'+cnum+'/r/'+rnum;
  if(navigator.share){
    navigator.share({title:found.recipe.title, text:text, url:url}).catch(function(){});
  } else {
    var full = text + '\n\n' + url;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).then(function(){ alert('Ricetta copiata negli appunti!'); }).catch(function(){});
    }
  }
};

/* ---------- modalit\u00e0 cucina (schermo acceso + testo grande) ---------- */
var wakeLockRef = null;
function releaseWakeLock(){
  if(wakeLockRef){ wakeLockRef.release().catch(function(){}); wakeLockRef = null; }
}
window.toggleCookingMode = function(){
  var on = document.body.classList.toggle('cooking-mode');
  if(on && 'wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(function(wl){ wakeLockRef = wl; }).catch(function(){});
  } else {
    releaseWakeLock();
  }
  render();
};
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && document.body.classList.contains('cooking-mode') && 'wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(function(wl){ wakeLockRef = wl; }).catch(function(){});
  }
});

/* ---------- lettura vocale dei passaggi ---------- */
window.readStepsAloud = function(steps, title){
  if(!('speechSynthesis' in window)) return;
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
  var text = title + '. ' + steps.map(function(s,i){ return 'Passaggio '+(i+1)+'. '+s; }).join(' ');
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'it-IT';
  speechSynthesis.speak(u);
};
window.readStepsAloudBtn = function(btn){
  var steps = JSON.parse(btn.getAttribute('data-steps'));
  var title = btn.getAttribute('data-title');
  window.readStepsAloud(steps, title);
};

/* ---------- filtri rapidi ---------- */
function applyFilter(tipo){
  if(tipo === 'veloci') return searchIndex.filter(function(it){
    var found = recipeByNums(it.cnum, it.rnum);
    if(!found || !found.recipe.time) return false;
    var secs = parseDurationSeconds(found.recipe.time);
    return secs && secs <= 20*60;
  });
  if(tipo === 'vegetariano') return searchIndex.filter(function(it){ return it.cnum === 7; });
  if(tipo === 'pesce') return searchIndex.filter(function(it){ return it.cnum === 6; });
  if(tipo === 'carne') return searchIndex.filter(function(it){ return it.cnum === 4 || it.cnum === 5; });
  return searchIndex;
}
var FILTER_LABELS = {veloci:'Ricette veloci (sotto 20 minuti)', vegetariano:'Vegetariano', pesce:'Pesce', carne:'Carne'};
function renderFiltro(tipo){
  var html = topbar({back:'#/', title:FILTER_LABELS[tipo] || 'Filtro'});
  html += '<div class="chero" style="padding-bottom:2px;"><h1>'+esc(FILTER_LABELS[tipo]||'')+'</h1></div>';
  var list = applyFilter(tipo);
  if(!list.length) return html + '<div class="empty">Nessuna ricetta trovata.</div>';
  html += '<div class="rlist">'+list.map(function(it){
    var fav = isFav(it.cnum, it.rnum);
    return '<button class="rrow" onclick="nav(\'#/c/'+it.cnum+'/r/'+it.rnum+'\')">'+
      iconCell(it.cnum, it.title)+
      '<div class="rmain"><div class="rt">'+esc(it.title)+'</div><div class="rmeta">'+esc(it.ctitle)+'</div></div>'+
      '<span role="button" aria-label="Preferito" class="rfav '+(fav?'active':'')+'" onclick="toggleFav('+it.cnum+','+it.rnum+',event)">'+favIcon()+'</span>'+
      '</button>';
  }).join('')+'</div>';
  return html;
}

window.handleCustomPhoto = function(input, callback){

/* ---------- timer nei passaggi ---------- */
var DURATION_RE = /(\d+)\s*(?:-\s*\d+\s*)?(minuti|minuto|min|ore|ora|secondi|second[oi])\b/i;
function parseDurationSeconds(text){
  var m = DURATION_RE.exec(text);
  if(!m) return null;
  var n = parseInt(m[1], 10);
  var unit = m[2].toLowerCase();
  if(unit.indexOf('or') === 0) return n*3600;
  if(unit.indexOf('sec') === 0) return n;
  return n*60;
}
function fmtDurationShort(s){
  if(s < 60) return s+' sec';
  if(s % 60 === 0) return (s/60)+' min';
  return Math.round(s/60)+' min';
}
function fmtClock(s){
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s/60), sec = s%60;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}
/* Pi\u00f9 timer insieme, basati su un orario di fine (endAt) invece che su un
   conteggio a scatti: cos\u00ec, anche se lo schermo si spegne o l'app va in
   background e il browser smette di far scorrere i secondi, non appena si
   torna sull'app il tempo rimanente viene ricalcolato dall'orologio reale
   del telefono e "recupera" subito il tempo passato. Il suono e la
   vibrazione, per\u00f2, possono scattare solo mentre l'app \u00e8 aperta: se lo
   schermo resta spento non si sentono finch\u00e9 non si riapre l'app. */
var timers = []; /* {id, key, label, duration, endAt, pausedRemaining, state} */
var timersIntervalId = null;
function timerRemaining(t){
  if(t.state === 'paused') return t.pausedRemaining;
  if(t.state === 'done') return 0;
  return Math.max(0, (t.endAt - Date.now()) / 1000);
}
function resyncTimers(){
  var justFinished = [];
  timers.forEach(function(t){
    if(t.state === 'running' && timerRemaining(t) <= 0){
      t.state = 'done';
      justFinished.push(t);
    }
  });
  if(justFinished.length){
    if(navigator.vibrate){ try{ navigator.vibrate([200,100,200,100,200]); }catch(e){} }
    playBeep();
    notifyTimersDone(justFinished);
  }
  renderTimerBar();
}
/* Notifica di sistema quando un timer finisce (oltre al bip in-app): richiede
   che l'utente l'abbia attivata una volta dalle Impostazioni. Su iOS funziona
   solo se l'app \u00e8 stata aggiunta alla schermata Home (richiede iOS 16.4+) e
   va mostrata tramite il service worker, non con un semplice "new Notification". */
function notifyTimersDone(doneTimers){
  if(!('Notification' in window) || Notification.permission !== 'granted' || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(function(reg){
    doneTimers.forEach(function(t){
      reg.showNotification('\u23f0 Timer finito', {
        body: t.label,
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: 'timer-'+t.id,
        vibrate: [200,100,200,100,200]
      }).catch(function(){});
    });
  }).catch(function(){});
}
window.requestTimerNotifications = function(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)) { render(); return; }
  if(Notification.permission === 'granted'){ render(); return; }
  if(Notification.permission === 'denied'){
    alert('Le notifiche sono bloccate per questa app. Per attivarle, vai nelle impostazioni del telefono alla voce di questa app (o di Safari) e consenti le notifiche, poi torna qui.');
    return;
  }
  Notification.requestPermission().then(function(){ render(); });
};
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) resyncTimers();
});
window.addEventListener('focus', resyncTimers);
window.addEventListener('pageshow', resyncTimers);
function renderTimerBar(){
  var el = document.getElementById('timerbar');
  if(!el) return;
  if(!timers.length){
    el.className = '';
    el.innerHTML = '';
    document.body.classList.remove('timer-active');
    document.body.style.removeProperty('--timers-count');
    return;
  }
  document.body.classList.add('timer-active');
  document.body.style.setProperty('--timers-count', String(timers.length));
  el.className = 'show';
  el.innerHTML = timers.map(function(t){
    var icon = t.state==='running' ? '&#10074;&#10074;' : '&#9654;';
    return '<div class="trow'+(t.state==='done'?' done':'')+'">'+
      '<div class="tlabel"><div class="tt">'+esc(t.label)+'</div><div class="tv">'+(t.state==='done' ? 'Fatto! \u2713' : fmtClock(timerRemaining(t)))+'</div></div>'+
      (t.state!=='done' ? '<button onclick="toggleTimerPause(\''+t.id+'\')" aria-label="Pausa">'+icon+'</button>' : '') +
      '<button onclick="cancelTimer(\''+t.id+'\')" aria-label="Chiudi">&#10005;</button>'+
      '</div>';
  }).join('');
}
function timersTick(){
  if(!timers.length){ clearInterval(timersIntervalId); timersIntervalId = null; return; }
  resyncTimers();
}
/* Piccola melodia "campanello" (do-mi-sol, poi sol un\u2019ottava sopra) invece di
   tre beep uguali: non serve nessun file audio, viene generata al volo. */
function playBeep(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var notes = [
      {t:0,    freq:523.25, dur:0.42}, // do5
      {t:0.16, freq:659.25, dur:0.42}, // mi5
      {t:0.32, freq:783.99, dur:0.55}, // sol5
      {t:0.52, freq:1046.5, dur:0.7}   // do6
    ];
    notes.forEach(function(n){
      [1, 2, 3].forEach(function(harmonic, idx){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = n.freq * harmonic;
        o.connect(g); g.connect(ctx.destination);
        var peak = 0.3 / (idx+1);
        var start = ctx.currentTime + n.t;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(peak, start+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, start+n.dur);
        o.start(start); o.stop(start+n.dur+0.02);
      });
    });
  }catch(e){}
}
var timerSeq = 0;
function startTimerInternal(seconds, label, key){
  key = key || label;
  var existing = timers.find(function(t){ return t.key === key; });
  if(existing){
    existing.duration = seconds;
    existing.endAt = Date.now() + seconds*1000;
    existing.state = 'running';
  } else {
    if(timers.length >= 4) timers.shift(); /* non pi\u00f9 di 4 insieme, per restare leggibili */
    timers.push({id:'t'+(++timerSeq), key:key, label:label, duration:seconds, endAt:Date.now()+seconds*1000, pausedRemaining:null, state:'running'});
  }
  if(!timersIntervalId) timersIntervalId = setInterval(timersTick, 1000);
  renderTimerBar();
}
window.startStepTimerFromBtn = function(btn, ev){
  if(ev) ev.stopPropagation();
  var secs = parseInt(btn.getAttribute('data-secs'), 10);
  var label = btn.getAttribute('data-label');
  var key = btn.getAttribute('data-key') || label;
  startTimerInternal(secs, label, key);
};
window.toggleTimerPause = function(id){
  var t = timers.find(function(x){ return x.id === id; });
  if(!t) return;
  if(t.state==='running'){ t.pausedRemaining = timerRemaining(t); t.state='paused'; }
  else if(t.state==='paused'){ t.endAt = Date.now() + t.pausedRemaining*1000; t.state='running'; }
  renderTimerBar();
};
window.cancelTimer = function(id){
  timers = timers.filter(function(t){ return t.id !== id; });
  if(!timers.length && timersIntervalId){ clearInterval(timersIntervalId); timersIntervalId = null; }
  renderTimerBar();
};

var UNIT_WORDS = ['g','gr','grammi','kg','chilo','chili','ml','cl','l','litro','litri',
  'cucchiai','cucchiaino','cucchiaini','cucchiaio','tazza','tazze','pizzico','pizzichi','fetta','fette',
  'confezione','confezioni','spicchio','spicchi','rametto','rametti','foglia','foglie','bicchiere','costa'];
function bareIngredientName(rest){
  var t = (rest || '').trim();
  // frazioni unicode iniziali (½ bicchiere di vino, ½ cipolla...) trattate come quantità
  t = t.replace(/^[½¼¾⅓⅔]\s*/, '');
  // articoli indeterminativi iniziali (un pizzico di sale, una confezione di...)
  t = t.replace(/^(un|una|uno)\s+/i, '');
  for(var i=0;i<UNIT_WORDS.length;i++){
    var re = new RegExp('^'+UNIT_WORDS[i]+"\\b\\s*(di\\s+|d['\u2019]\\s*)?", 'i');
    if(re.test(t)){ return t.replace(re, '').trim(); }
  }
  return t;
}

function canonicalIngredientName(rest){
  var bare = bareIngredientName(rest);

function collectAllIngredientNames(){
  if(ALL_INGREDIENT_NAMES) return ALL_INGREDIENT_NAMES;
  var set = {};

      r.ingredients.forEach(function(ing){
        var m = NUM_RE.exec(ing);

        var canon = canonicalIngredientName(rest);
        if(canon) set[normalize(canon)] = canon;

    });
  });
  ALL_INGREDIENT_NAMES = Object.keys(set).map(function(k){ return set[k]; }).sort(function(a,b){ return a.localeCompare(b); });

/* ingredienti freschi il cui nome contiene una parola di dispensa (peperoni ~ "pepe", fagiolini ~ "fagioli"): vanno in Verdura */
var FRESH_OVERRIDES = ['peperon','fagiolin'];
function categoryFor(text){
  var n = normalize(text);
  var verdura = CATEGORY_LIST[CATEGORY_LIST.length-1];
  for(var f=0;f<FRESH_OVERRIDES.length;f++){
    if(n.indexOf(FRESH_OVERRIDES[f]) !== -1) return verdura;
  }
  for(var i=0;i<CATEGORY_LIST.length;i++){
    var cat = CATEGORY_LIST[i];
    for(var j=0;j<cat.words.length;j++){
      var w = cat.words[j];
      if(w.charAt(0) === '='){
        if(new RegExp('\\b'+w.slice(1)+'\\b').test(n)) return cat;
      } else if(n.indexOf(w) !== -1) return cat;
    }
  }
  return {name:'Altro', icon:ico('cart'), words:[]};
}

function safeKey(s){ return normalize(s).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
var UNIT_CANON = {
  g:'g', gr:'g', grammi:'g', kg:'kg', chilo:'kg', chili:'kg',
  ml:'ml', cl:'cl', l:'l', litro:'l', litri:'l',
  cucchiai:'cucchiaio', cucchiaino:'cucchiaino', cucchiaini:'cucchiaino', cucchiaio:'cucchiaio',
  tazza:'tazza', tazze:'tazza', pizzico:'pizzico', pizzichi:'pizzico',
  fetta:'fetta', fette:'fetta', confezione:'confezione', confezioni:'confezione',
  spicchio:'spicchio', spicchi:'spicchio', rametto:'rametto', rametti:'rametto',
  foglia:'foglia', foglie:'foglia', bicchiere:'bicchiere', costa:'costa'
};
var FRAC_VALUES = {'\u00bd':0.5, '\u00bc':0.25, '\u00be':0.75, '\u2153':1/3, '\u2154':2/3};
function parseQtyPrefix(text){
  var t = (text||'').trim();
  var fm = t.match(/^([\u00bd\u00bc\u00be\u2153\u2154])\s*/);
  if(fm) return {qty: FRAC_VALUES[fm[1]], rest: t.slice(fm[0].length).trim()};
  var m = NUM_RE.exec(t);
  if(m) return {qty: parseFloat(m[1].replace(',', '.')), rest: m[2].trim()};
  return {qty: null, rest: t};
}
function extractUnitType(rest){
  var t = (rest||'').trim().replace(/^(un|una|uno)\s+/i, '');
  for(var u in UNIT_CANON){
    if(new RegExp('^'+u+'\\b', 'i').test(t)) return UNIT_CANON[u];
  }
  return null;
}
/* Riceve righe {text, recipeTitle}. Somma le quantit\u00e0 quando stesso
   prodotto E stessa unit\u00e0 (non unisce mai "200 g" con "2 pezzi": sarebbe un
   errore), e tiene traccia di quali ricette usano ciascun ingrediente. */
function buildShoppingList(lines){
  var groups = {};
  lines.forEach(function(item){
    var txt = item.text, recipeTitle = item.recipeTitle;
    var p = parseQtyPrefix(txt);
    var rest = p.rest || txt.trim();
    if(isPantryStaple(rest)) return;
    var unit = extractUnitType(rest);
    var canonName = canonicalIngredientName(rest);
    var k = (unit||'count') + '|' + normalize(canonName);
    if(!groups[k]) groups[k] = {rest:rest, total:0, hasNum:false, count:0, bestQty:-1, recipes:[]};
    var g = groups[k];
    g.count++;
    if(p.qty !== null){
      g.total += p.qty; g.hasNum = true;
      if(p.qty > g.bestQty){ g.bestQty = p.qty; g.rest = rest; }
    }
    if(recipeTitle && g.recipes.indexOf(recipeTitle) === -1) g.recipes.push(recipeTitle);
  });
  var out = Object.keys(groups).map(function(k){
    var g = groups[k];
    var label = g.hasNum ? (fmtNum(g.total)+' '+g.rest) : (g.count>1 ? g.rest+' (x'+g.count+')' : g.rest);
    var cat = categoryFor(g.rest);
    return {key:safeKey(g.rest), label:label, cat:cat.name, icon:cat.icon, recipes:g.recipes};
  });
  out.sort(function(a,b){
    var ci = CATEGORY_LIST.map(function(c){return c.name;}).concat(['Altro']);
    var d = ci.indexOf(a.cat) - ci.indexOf(b.cat);
    if(d !== 0) return d;
    return a.label.localeCompare(b.label);
  });
  return out;
}

/* ---------- ricerca tollerante (refusi, singolari/plurali) ---------- */
function wordsOf(s){
  return normalize(s).split(/[^a-z0-9]+/).filter(function(w){ return w.length >= 2; });
}
function osaDistance(a, b){
  var al = a.length, bl = b.length, i, j;
  if(!al) return bl; if(!bl) return al;
  var d = [];
  for(i=0;i<=al;i++){ d[i] = [i]; }
  for(j=1;j<=bl;j++){ d[0][j] = j; }
  for(i=1;i<=al;i++){
    for(j=1;j<=bl;j++){
      var cost = a.charAt(i-1) === b.charAt(j-1) ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      if(i>1 && j>1 && a.charAt(i-1)===b.charAt(j-2) && a.charAt(i-2)===b.charAt(j-1)){
        d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);
      }
    }
  }
  return d[al][bl];
}
function stemIt(w){ return w.length > 4 ? w.replace(/[aeio]$/, '') : w; }
/* 2 = stessa radice (zucchina~zucchine), 3 = refuso, -1 = nessuna corrispondenza */
function wordSimilarity(t, words){
  var tl = t.length;
  if(tl < 3) return -1;
  var st = stemIt(t), best = -1, k = tl <= 3 ? 0 : (tl <= 7 ? 1 : 2);
  for(var i=0;i<words.length;i++){
    var w = words[i];
    if(st.length >= 3 && w.indexOf(st) === 0) return 2;
    if(k > 0 && Math.abs(w.length - tl) <= k + 2){
      var dd = Math.min(osaDistance(t, w), osaDistance(t, w.slice(0, tl)));
      if(dd <= k) best = 3;
    }
  }
  return best;
}
function itemWords(it){
  if(!it._tw){ it._tw = wordsOf(it.title); it._aw = wordsOf(it.hay); }
  return it;
}
/* punteggio basso = migliore; -1 = non corrisponde */
function searchScore(it, tokens){
  itemWords(it);
  var titleN = normalize(it.title), worst = 0;
  for(var i=0;i<tokens.length;i++){
    var t = tokens[i], sc;
    if(titleN.indexOf(t) !== -1) sc = 0;
    else if(it.hay.indexOf(t) !== -1) sc = 1;
    else {
      var a = wordSimilarity(t, it._tw);
      var b = a === -1 ? wordSimilarity(t, it._aw) : a;
      if(b === -1) return -1;
      if(b === 2) sc = (a === 2) ? 0.5 : 1.5;
      else sc = (a === 3) ? 3 : 4;
    }
    if(sc > worst) worst = sc;
  }
  return worst;
}
function fuzzySearch(q, pool){
  var tokens = wordsOf(q);
  if(!tokens.length) return {exact:[], similar:[]};
  var exact = [], similar = [];
  pool.forEach(function(it, idx){
    var sc = searchScore(it, tokens);
    if(sc < 0) return;
    (sc <= 2 ? exact : similar).push({it:it, sc:sc, idx:idx});
  });
  var byScore = function(a,b){ return a.sc - b.sc || a.idx - b.idx; };
  exact.sort(byScore); similar.sort(byScore);
  return {
    exact: exact.map(function(x){ return x.it; }),
    similar: similar.map(function(x){ return x.it; })
  };
}
function nameFuzzyMatch(name, nq){
  var n = normalize(name);
  if(!nq || n.indexOf(nq) !== -1) return true;
  var tokens = wordsOf(nq), words = wordsOf(n);
  if(!tokens.length) return true;
  return tokens.every(function(t){ return n.indexOf(t) !== -1 || wordSimilarity(t, words) !== -1; });
}
