/* ---- dado animato: prima si sceglie primo o secondo (il secondo arriva con un contorno) ---- */
var diceTimer = null;
var diceMode = null;      /* 'primo' | 'secondo' | 'any' */
var diceLastSide = null;
function dicePool(mode){
  if(mode === 'primo') return poolForMeal('pranzo');
  if(mode === 'secondo') return poolForMeal('cena');
  return randomPool();
}
function notRecent(pool){
  var fresh = pool.filter(function(it){ return !recents.some(function(r){ return r.cnum===it.cnum && r.rnum===it.rnum; }); });
  return fresh.length ? fresh : pool;
}
function pickRandomItem(mode){
  var pool = notRecent(dicePool(mode));
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function pickSide(){
  var pool = poolForMeal('contorno');
  if(diceLastSide && pool.length > 1) pool = pool.filter(function(it){ return !(it.cnum===diceLastSide.cnum && it.rnum===diceLastSide.rnum); });
  if(!pool.length) return null;
  return (diceLastSide = pool[Math.floor(Math.random()*pool.length)]);
}
function reducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
window.openDice = function(){
  var ov = document.getElementById('diceov');
  if(!ov) return;
  diceMode = null; diceLastSide = null;
  ov.innerHTML = '<div class="dice-card choose" id="diceCard">'+
    '<button class="dice-x" onclick="closeDice()" aria-label="Chiudi">'+ico('x')+'</button>'+
    '<div class="dice-die">'+ico('dice')+'</div>'+
    '<div class="dice-kick">Il dado ha fame</div>'+
    '<h2 class="dice-q">Cosa ti va stasera?</h2>'+
    '<div class="dice-choices">'+
      '<button class="dice-choice" onclick="startDice(\'primo\')"><span class="dc-ic">'+ico('bowl')+'</span><span><b>Un primo</b><small>pasta, riso, zuppe e minestre</small></span></button>'+
      '<button class="dice-choice" onclick="startDice(\'secondo\')"><span class="dc-ic">'+ico('drumstick')+'</span><span><b>Un secondo</b><small>con un contorno in accompagnamento</small></span></button>'+
    '</div>'+
    '<button class="dice-any" onclick="startDice(\'any\')">Decide il dado</button></div>';
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
};
window.startDice = function(mode){
  var ov = document.getElementById('diceov');
  if(!ov) return;
  diceMode = mode || 'any';
  ov.innerHTML = '<div class="dice-card" id="diceCard">'+
    '<button class="dice-x" onclick="closeDice()" aria-label="Chiudi">'+ico('x')+'</button>'+
    '<div class="dice-die">'+ico('dice')+'</div>'+
    '<div class="dice-kick" id="diceKick">Il dado sta scegliendo…</div>'+
    '<div class="reel"><div class="reel-in" id="reelIn"></div><div class="reel-mid"></div></div>'+
    '<div class="dice-res" id="diceRes"></div></div>';
  rollDice();
};
window.closeDice = function(){
  var ov = document.getElementById('diceov');
  if(diceTimer){ clearTimeout(diceTimer); diceTimer = null; }
  if(ov){ ov.classList.remove('show'); ov.innerHTML = ''; }
  document.body.style.overflow = '';
};
function sideHtml(side){
  if(!side) return '';
  var f = recipeByNums(side.cnum, side.rnum);
  var r = f ? f.recipe : {title:side.title};
  return '<div class="dice-side"><div class="dice-kick">In accompagnamento · contorno</div>'+
    '<div class="side-row"><button class="side-go" onclick="closeDice();nav(\'#/c/'+side.cnum+'/r/'+side.rnum+'\')"><span class="side-ic">'+ico('leaf')+'</span><span class="side-t">'+esc(side.title)+'</span></button>'+
    '<button class="side-swap" onclick="swapSide()" aria-label="Cambia contorno">'+ico('dice')+'</button></div></div>';
}
window.swapSide = function(){
  var box = document.getElementById('diceSide'); if(!box) return;
  box.innerHTML = sideHtml(pickSide());
};
function rollDice(){
  var card = document.getElementById('diceCard');
  var reel = document.getElementById('reelIn');
  if(!card || !reel) return;
  var mode = diceMode || 'any';
  var it = pickRandomItem(mode);
  if(!it){ closeDice(); return; }
  if(diceTimer){ clearTimeout(diceTimer); diceTimer = null; }
  card.className = 'dice-card rolling';
  document.getElementById('diceKick').textContent = mode==='primo' ? 'Il dado sceglie il primo…' : mode==='secondo' ? 'Il dado sceglie il secondo…' : 'Il dado sta scegliendo…';
  var pool = dicePool(mode);
  var titles = [];
  for(var i=0;i<24;i++){
    var t = pool[Math.floor(Math.random()*pool.length)].title;
    if(t === it.title || t === titles[i-1]) t = pool[(i*7 + 3) % pool.length].title;
    titles.push(t);
  }
  titles.push(it.title);
  titles.push(pool[Math.floor(Math.random()*pool.length)].title);
  titles.push(pool[Math.floor(Math.random()*pool.length)].title);
  reel.style.transition = 'none';
  reel.style.transform = 'translateY(0)';
  reel.innerHTML = titles.map(function(t){ return '<div class="reel-it">'+esc(t)+'</div>'; }).join('');
  var targetIdx = 24;
  var finished = false;
  function finish(){
    if(finished) return; finished = true;
    var f = recipeByNums(it.cnum, it.rnum);
    var r = f ? f.recipe : {title:it.title};
    var side = mode === 'secondo' ? pickSide() : null;
    document.getElementById('diceRes').innerHTML =
      photoOrPlaceholder(it.cnum, it.title)+
      '<div class="dice-kick">'+(mode==='primo' ? 'Stasera, come primo' : mode==='secondo' ? 'Stasera, come secondo' : 'Stasera si cucina')+'</div>'+
      '<h2>'+esc(it.title)+'</h2>'+
      '<div class="st-meta">'+recipeMetaHtml(r)+'</div>'+
      '<div id="diceSide">'+sideHtml(side)+'</div>'+
      '<div class="dice-btns"><button class="dice-again" onclick="rollDice()">'+ico('dice')+'Ritenta</button>'+
      '<button class="dice-go" onclick="closeDice();nav(\'#/c/'+it.cnum+'/r/'+it.rnum+'\')">'+ico('chef')+'Cuciniamo</button></div>'+
      '<button class="dice-back" onclick="openDice()">Cambia scelta</button>';
    card.className = 'dice-card done';
    try{ if(navigator.vibrate) navigator.vibrate(18); }catch(e){}
  }
  if(reducedMotion()){ finish(); return; }
  void reel.offsetWidth;
  reel.style.transition = 'transform 2.9s cubic-bezier(.12,.62,.08,1)';
  reel.style.transform = 'translateY(' + (-(targetIdx-1)*44) + 'px)';
  diceTimer = setTimeout(finish, 3050);
}

window.checkForUpdate = function(){
  var btn = document.getElementById('updateBtn');
  if(btn) btn.classList.add('spinning');
  lsSet(LS_UPDATE_FROM, APP_VERSION);
  var tasks = [];
  if(window.caches && caches.keys){
    tasks.push(caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }).catch(function(){}));
  }
  if('serviceWorker' in navigator){
    tasks.push(navigator.serviceWorker.getRegistration().then(function(reg){
      return reg && reg.update();
    }).catch(function(){}));
  }
  Promise.all(tasks).catch(function(){}).then(function(){
    location.reload();
  });
};

var PIANO_STATS_CATEGORIES = {3:'Primi', 4:'Carne bianca', 5:'Carne rossa', 6:'Pesce', 7:'Legumi e vegetariano'};
function pianoStatsHtml(){
  var counts = {};
  var order = [];
  function bump(label){
    if(!counts[label]){ counts[label] = 0; order.push(label); }
    counts[label]++;
  }
  PIANO_DAYS.forEach(function(day){
    ['pranzo','cena'].forEach(function(mealKey){
      var a = piano[day.key+'-'+mealKey];
      if(!a) return;
      if(a.special){ bump('Fuori casa'); return; }
      if(a.customText) return;
      if(!recipeByNums(a.cnum, a.rnum)) return;
      var label = PIANO_STATS_CATEGORIES[a.cnum];
      if(label) bump(label);
    });
  });
  if(!order.length) return '';
  return '<div class="piano-stats"><div class="piano-stats-title">Equilibrio della settimana</div>'+
    '<div class="piano-stats-row">'+order.map(function(label){
      return '<span class="stat-pill">'+esc(label)+' &times; '+counts[label]+'</span>';
    }).join('')+'</div></div>';
}

function pianoRowHtml(slot, meal){

var PICKER_FILTERS = [
  {key:'primi', label:'Primi'},
  {key:'secondi', label:'Secondi'},
  {key:'vegetariano', label:'Vegetariano'},
  {key:'pesce', label:'Pesce'},
  {key:'carne', label:'Carne'},
  {key:'antipasti', label:'Antipasti'},
  {key:'contorni', label:'Contorni'},
  {key:'dolci', label:'Dolci'},
  {key:'tutti', label:'Tutti'}
];
function pickerFilterPool(filterKey){
  if(filterKey === 'vegetariano') return searchIndex.filter(function(it){ return it.cnum === 7; });
  if(filterKey === 'pesce') return searchIndex.filter(function(it){ return it.cnum === 6; });
  if(filterKey === 'carne') return searchIndex.filter(function(it){ return it.cnum === 4 || it.cnum === 5; });
  if(filterKey === 'dolci') return searchIndex.filter(function(it){ return it.cnum === 9; });
  if(filterKey === 'contorni') return searchIndex.filter(function(it){ return it.cnum === 8; });
  if(filterKey === 'antipasti') return searchIndex.filter(function(it){ return it.cnum === 2; });
  if(filterKey === 'primi') return searchIndex.filter(function(it){ return !EXCLUDED_FROM_RANDOM[it.cnum] && recipeTipo(it.cnum,it.rnum) === 'primo'; });
  if(filterKey === 'secondi') return searchIndex.filter(function(it){ return !EXCLUDED_FROM_RANDOM[it.cnum] && recipeTipo(it.cnum,it.rnum) === 'secondo'; });
  return searchIndex;
}
var pickerState = {slot:null, filter:null, query:''};
function ensurePickerState(slot){
  if(pickerState.slot !== slot){
    var mealKey = slot.split('-')[1];
    var def = mealKey==='pranzo' ? 'primi' : (mealKey==='contorno' ? 'contorni' : 'secondi');
    pickerState = {slot:slot, filter:def, query:''};
  }
}
function pickResultsHtml(slot, q, filterKey){
  var nq = normalize(q);
  var pool = pickerFilterPool(filterKey);
  var list = pool;
  if(nq){ var fr = fuzzySearch(q, pool); list = fr.exact.concat(fr.similar); }
  if(!list.length) return '<div class="empty">Nessuna ricetta trovata con questo filtro.</div>';
  return list.map(function(it){
    return '<button class="rrow" onclick="assignToPiano(\''+slot+'\','+it.cnum+','+it.rnum+')">'+
      iconCell(it.cnum, it.title)+
      '<div class="rmain"><div class="rt">'+esc(it.title)+'</div><div class="rmeta">'+esc(it.ctitle)+'</div></div>'+
      '</button>';
  }).join('');
}
window.onPickFilter = function(val){
  pickerState.query = val;
  var el = document.getElementById('pickResults');
  if(el) el.innerHTML = pickResultsHtml(pickerState.slot, pickerState.query, pickerState.filter);
};
window.setPickerFilter = function(key){
  pickerState.filter = key;

    '<form onsubmit="return savePianoWish(\''+slot+'\',event)" style="display:flex;gap:8px;align-items:flex-start;">'+
    '<div class="field" style="margin:0;flex:1;"><input type="text" id="pianoWishInput" placeholder="Es. gnocchi al pesto (da comprare)" value="'+escAttr((piano[slot]&&piano[slot].customText)||'')+'"></div>'+
    '<button type="submit" class="btn-ghost" style="margin:0;width:auto;padding:13px 18px;">Salva</button>'+
    '</form></div>';
  html += '<div class="hero" style="padding-bottom:6px;"><div class="search-wrap"><span class="sicon">'+ico('search')+'</span>'+
    '<input id="searchInput" type="text" placeholder="\u2026oppure cerca una ricetta" value="'+escAttr(pickerState.query)+'" oninput="onPickFilter(this.value)"></div></div>';
  html += '<div class="chips-row">'+PICKER_FILTERS.map(function(f){
    var active = f.key === pickerState.filter;
    return '<button class="chip'+(active?' chip-active':'')+'" onclick="setPickerFilter(\''+f.key+'\')">'+esc(f.label)+'</button>';
  }).join('')+'</div>';
  html += '<div id="pickResults" class="rlist pickrow">'+pickResultsHtml(slot, pickerState.query, pickerState.filter)+'</div>';
  return html;

function renderSpesa(){

    return html;
  }
  var lines = [];
  var recipeNames = [];
  slots.forEach(function(slot){
    var a = piano[slot];
    var found = recipeByNums(a.cnum, a.rnum);
    if(found){
      recipeNames.push(found.recipe.title);
      found.recipe.ingredients.forEach(function(ing){ lines.push({text:ing, recipeTitle:found.recipe.title}); });
    }
  });
  var items = buildShoppingList(lines);

    html += '<div class="empty">Tutti gli ingredienti di questi pasti sono nella tua dispensa fissa.</div>';

  var lastCat = null;
  items.forEach(function(it){
    if(it.cat !== lastCat){
      html += '<div class="week-label">'+it.icon+' '+esc(it.cat)+'</div>';

    '<div class="field" style="margin-bottom:8px;"><input type="text" id="dispensaNew" placeholder="Aggiungi un ingrediente (es. zucchero)"></div>'+
    '<button type="submit" class="btn-ghost" style="margin-top:0;">Aggiungi</button></form>';
  var names = collectAllIngredientNames();
  var extra = Object.keys(dispensa).filter(function(k){
    return !names.some(function(n){ return normalize(n) === k; });
  });
  html += '<div class="week-label">Dagli ingredienti del libro</div>';
  html += names.map(function(n){
    var k = normalize(n);
    var on = !!dispensa[k];
    return '<div class="ing-item '+(on?'done':'')+'" onclick="toggleDispensa(\''+jsq(k)+'\')" style="padding:9px 20px;">'+

  }).join('');

    html += extra.map(function(k){
      return '<div class="ing-item done" onclick="toggleDispensa(\''+jsq(k)+'\')" style="padding:9px 20px;">'+
        '<span class="box">&#10003;</span><span class="txt">'+esc(k)+'</span></div>';
    }).join('');
  }
  return html;
}

/* ---------- classificazione primo / secondo (per il piano) ---------- */
var PRIMO_KEYWORDS = ['cous cous','couscous','pasta','riso','farro','orzo'];
function recipeTipo(cnum, rnum){
  if(cnum === 3) return 'primo';
  if(cnum === 4 || cnum === 6) return 'secondo';
  if(cnum === 7){
    var found = recipeByNums(cnum, rnum);
    if(!found) return 'secondo';
    var t = normalize(found.recipe.title);
    var isPrimo = PRIMO_KEYWORDS.some(function(k){ return t.indexOf(k) !== -1; });
    return isPrimo ? 'primo' : 'secondo';
  }
  return 'secondo';
}

/* ---------- evita maiale, storico delle settimane e bilanciamento del piano ---------- */
var LS_NOPORK = 'ricettario_nopork_v1';
var LS_STAGIONE = 'ricettario_stagione_v1';
var LS_STORICO = 'ricettario_piano_storico_v1';
/* piatti "a base di maiale" (la carne stessa) e salumi usati come condimento (pancetta, guanciale, prosciutto): solo i primi vengono evitati dal piano */
var PORK_RE = /maiale|suino|salsicc|arista|costine|lonza|porchetta|cotechino|wurstel|spuntatur|stinco|braciole di maiale/;
var SALUMI_RE = /guanciale|pancetta|prosciutto|speck|mortadella|bacon|lardo|nduja|salame(?! di cioccolato)/;
function hasSalumi(cnum, rnum){
  var found = recipeByNums(cnum, rnum);
  if(!found) return false;
  return found.recipe.ingredients.some(function(ing){ return SALUMI_RE.test(normalize(ing)); });
}
var porkCache = {};
function isPorkRecipe(cnum, rnum){
  var k = cnum + '-' + rnum;
  if(porkCache[k] !== undefined) return porkCache[k];
  var found = recipeByNums(cnum, rnum), res = false;
  if(found){
    res = found.recipe.ingredients.some(function(ing){ return PORK_RE.test(normalize(ing)); }) || PORK_RE.test(normalize(found.recipe.title));
  }
  porkCache[k] = res;
  return res;
}
function noPorkOn(){
  var v = lsGet(LS_NOPORK);
  return v === null ? true : v === '1';
}
window.toggleNoPork = function(){
  lsSet(LS_NOPORK, noPorkOn() ? '0' : '1');
  render();
};
/* ---------- piatti di stagione: P primavera, E estate, A autunno, I inverno ---------- */
function stagioneOn(){
  var v = lsGet(LS_STAGIONE);
  return v === null ? true : v === '1';
}
window.toggleStagione = function(){
  lsSet(LS_STAGIONE, stagioneOn() ? '0' : '1');
  render();
};
function currentSeasonCode(){
  var m = new Date().getMonth(); /* 0 = gennaio */
  if(m >= 2 && m <= 4) return 'P';
  if(m >= 5 && m <= 7) return 'E';
  if(m >= 8 && m <= 10) return 'A';
  return 'I';
}
var SEASON_NAMES = {P:'primavera', E:'estate', A:'autunno', I:'inverno'};
function seasonLabelFor(code){
  var map = {PE:[ico('sun'),'Piatto primaverile-estivo'], AI:[ico('leaf'),'Piatto autunnale-invernale'], P:[ico('sprout'),'Piatto di primavera'], E:[ico('sun'),'Piatto estivo'], A:[ico('leaf'),'Piatto autunnale'], I:[ico('snow'),'Piatto invernale']};
  var m = map[code];
  if(m) return m[0]+' '+m[1];
  return ico('leaf')+' Di stagione: ' + code.split('').map(function(c){ return SEASON_NAMES[c]; }).join(', ');
}
function recipeInSeason(cnum, rnum){
  var found = recipeByNums(cnum, rnum);
  if(!found || !found.recipe.stagioni) return true; /* senza indicazione: va bene tutto l'anno */
  return found.recipe.stagioni.indexOf(currentSeasonCode()) !== -1;
}
/* restringe a quelle di stagione solo se ne restano abbastanza per variare */
function applySeasonFilter(list, minKeep){
  if(!stagioneOn()) return list;
  var f = list.filter(function(it){ return recipeInSeason(it.cnum, it.rnum); });
  return f.length >= (minKeep || 8) ? f : list;
}
function recipeKeysInPiano(){
  var keys = {};
  Object.keys(piano).forEach(function(slot){
    var a = piano[slot];
    if(a && !a.special && !a.customText) keys[a.cnum+'-'+a.rnum] = true;
  });
  return keys;
}
function loadStorico(){
  try{ var a = JSON.parse(lsGet(LS_STORICO) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
function snapshotPiano(){
  var keys = Object.keys(recipeKeysInPiano());
  if(!keys.length) return;
  var st = loadStorico();
  st.unshift(keys);
  lsSet(LS_STORICO, JSON.stringify(st.slice(0, 2)));
}
function storicoSet(n){
  var set = {};
  loadStorico().slice(0, n).forEach(function(keys){ keys.forEach(function(k){ set[k] = true; }); });
  return set;
}
function secondoCategory(it){
  if(it.cnum === 4) return 'bianca';
  if(it.cnum === 5) return 'rossa';
  if(it.cnum === 6) return 'pesce';
  return 'veg';
}
var CENA_CAPS = {bianca:2, rossa:2, pesce:3, veg:3};
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function poolForMeal(mealKey){
  var avoid = noPorkOn();
  var okPork = function(it){ return !avoid || !isPorkRecipe(it.cnum, it.rnum); };
  if(mealKey === 'contorno') return applySeasonFilter(searchIndex.filter(function(it){ return it.cnum === 8 && okPork(it); }), 10);
  var tipo = mealKey === 'pranzo' ? 'primo' : 'secondo';
  return applySeasonFilter(searchIndex.filter(function(it){
    return !EXCLUDED_FROM_RANDOM[it.cnum] && recipeTipo(it.cnum, it.rnum) === tipo && okPork(it);
  }), 14);
}

window.fillPianoAuto = function(){
  var usedNow = recipeKeysInPiano();
  /* quanti posti vuoti per ogni tipo di pasto */
  var empties = {pranzo:0, cena:0, contorno:0};
  PIANO_DAYS.forEach(function(day){
    if(!piano[day.key+'-pranzo']) empties.pranzo++;
    var cenaA = piano[day.key+'-cena'];
    if(!cenaA) empties.cena++;
    if(!piano[day.key+'-contorno'] && !(cenaA && cenaA.special)) empties.contorno++;
  });
  var hist2 = storicoSet(2), hist1 = storicoSet(1);
  /* candidati: evita le ricette già nel piano e quelle delle ultime settimane, se ne restano abbastanza */
  function candidates(mealKey){
    var base = poolForMeal(mealKey).filter(function(it){ return !usedNow[it.cnum+'-'+it.rnum]; });
    var need = empties[mealKey];
    var tiers = [hist2, hist1];
    for(var t=0;t<tiers.length;t++){
      var c = base.filter(function(it){ return !tiers[t][it.cnum+'-'+it.rnum]; });
      if(c.length >= need) return shuffleArr(c);
    }
    return shuffleArr(base);
  }
  var lists = {pranzo: candidates('pranzo'), cena: candidates('cena'), contorno: candidates('contorno')};
  var porkCount = 0;
  Object.keys(usedNow).forEach(function(k){ var p = k.split('-'); if(isPorkRecipe(+p[0], +p[1])) porkCount++; });

  function take(list, filterFn){
    for(var i=0;i<list.length;i++){
      var it = list[i], key = it.cnum+'-'+it.rnum;
      if(usedNow[key]) continue;
      if(isPorkRecipe(it.cnum, it.rnum) && porkCount >= 1) continue; /* al massimo un piatto con maiale a settimana */
      if(filterFn && !filterFn(it)) continue;
      usedNow[key] = true;
      if(isPorkRecipe(it.cnum, it.rnum)) porkCount++;
      return it;
    }
    return null;
  }

  /* secondi: sequenza di categorie bilanciata (almeno 1 pesce e 1 vegetariano, al massimo 2 carni rosse e 2 bianche) */
  var counts = {bianca:0, rossa:0, pesce:0, veg:0};
  Object.keys(piano).forEach(function(slot){
    if(slot.split('-')[1] !== 'cena') return;
    var a = piano[slot];
    if(!a || a.special || a.customText) return;
    counts[secondoCategory(a)]++;
  });
  var seq = [];
  for(var i=0;i<empties.cena;i++){
    var cat;
    if(counts.pesce === 0) cat = 'pesce';
    else if(counts.veg === 0) cat = 'veg';
    else {
      var cats = Object.keys(CENA_CAPS).filter(function(c){ return counts[c] < CENA_CAPS[c]; });
      if(!cats.length) cats = Object.keys(CENA_CAPS);
      var best = Math.min.apply(null, cats.map(function(c){ return counts[c]/CENA_CAPS[c]; }));
      var tied = cats.filter(function(c){ return counts[c]/CENA_CAPS[c] === best; });
      cat = tied[Math.floor(Math.random()*tied.length)];
    }
    counts[cat]++;
    seq.push(cat);
  }
  seq = shuffleArr(seq);

  PIANO_DAYS.forEach(function(day){
    var slotP = day.key+'-pranzo';
    if(!piano[slotP]){
      var pick = take(lists.pranzo);
      if(pick) piano[slotP] = {cnum:pick.cnum, rnum:pick.rnum};
    }
    var slotC = day.key+'-cena';
    if(!piano[slotC]){
      var wanted = seq.shift();
      var pickC = take(lists.cena, function(it){ return secondoCategory(it) === wanted; }) || take(lists.cena);
      if(pickC) piano[slotC] = {cnum:pickC.cnum, rnum:pickC.rnum};
    }
    var cenaAssigned = piano[slotC];
    var contornoSlot = day.key+'-contorno';
    if(!piano[contornoSlot] && !(cenaAssigned && cenaAssigned.special)){
      var pickK = take(lists.contorno);
      if(pickK) piano[contornoSlot] = {cnum:pickK.cnum, rnum:pickK.rnum};
    }
  });
  savePiano();
  render();
};

window.rerollPianoSlot = function(slot, ev){
  if(ev) ev.stopPropagation();
  var mealKey = slot.split('-')[1];
  var pool = poolForMeal(mealKey);
  if(!pool.length) return;
  var current = piano[slot];
  var inWeek = recipeKeysInPiano();
  var choices = pool.filter(function(it){ return !inWeek[it.cnum+'-'+it.rnum]; });
  if(!choices.length) choices = pool.filter(function(it){ return !(current && it.cnum===current.cnum && it.rnum===current.rnum); });
  if(!choices.length) choices = pool;
  var pick = choices[Math.floor(Math.random()*choices.length)];
  piano[slot] = {cnum:pick.cnum, rnum:pick.rnum};
  savePiano();
  render();
};

var FRIDGE_KEYS = null;
function fridgeFamilyMatches(fam, ing){
  var n = normalize(ing);
  return fam[1].test(n) && !(fam[2] && fam[2].test(n));
}
function collectPerishableNames(){
  if(FRIDGE_KEYS) return FRIDGE_KEYS;
  FRIDGE_KEYS = FRIDGE_FAMILIES.filter(function(fam){
    return CHAPTERS.some(function(c){
      return c.recipes.some(function(r){
        return r.ingredients.some(function(ing){ return fridgeFamilyMatches(fam, ing); });
      });
    });
  }).map(function(fam){ return fam[0]; });
  return FRIDGE_KEYS;
}
function svuotaKeyMatchesIngredient(ing, k){
  for(var i=0;i<FRIDGE_FAMILIES.length;i++){
    if(normalize(FRIDGE_FAMILIES[i][0]) === k) return fridgeFamilyMatches(FRIDGE_FAMILIES[i], ing);
  }
  return false;
}
/* full = ricette che usano TUTTI gli ingredienti scelti; partial = ne usano solo alcuni */
function svuotaFrigoResults(selectedKeys){
  var full = [], partial = [];
  CHAPTERS.forEach(function(c){
    c.recipes.forEach(function(r){
      var matched = [], missing = [];
      selectedKeys.forEach(function(k){
        if(r.ingredients.some(function(ing){ return svuotaKeyMatchesIngredient(ing, k); })) matched.push(k);
        else missing.push(k);
      });
      if(!matched.length) return;
      var item = {cnum:c.num, rnum:r.num, title:r.title, ctitle:c.title,
        matchCount:matched.length, missing:missing, extra:r.ingredients.length};
      (missing.length ? partial : full).push(item);
    });
  });
  full.sort(function(a,b){ return a.extra - b.extra || a.title.localeCompare(b.title); });
  partial.sort(function(a,b){ return b.matchCount - a.matchCount || a.extra - b.extra; });
  return {full: full.slice(0, 30), partial: partial.slice(0, 10)};
}
function svuotaDisplayName(k){
  for(var i=0;i<FRIDGE_FAMILIES.length;i++){ if(normalize(FRIDGE_FAMILIES[i][0]) === k) return FRIDGE_FAMILIES[i][0]; }
  return k;
}
function svuotaRowHtml(it, withMissing){
  var meta = esc(it.ctitle);
  if(withMissing){
    meta += ' &middot; ne usa '+it.matchCount+' su '+(it.matchCount+it.missing.length)+' &middot; manca: '+it.missing.map(function(k){ return esc(svuotaDisplayName(k)); }).join(', ');
  }
  return '<button class="rrow" onclick="nav(\'#/c/'+it.cnum+'/r/'+it.rnum+'\')">'+

}

/* ---- rete ---- */
function fbFetch(url, opts){
  return fetch(url, opts).then(function(r){
    return r.text().then(function(t){
      var j = {}; try{ j = t ? JSON.parse(t) : {}; }catch(e){ j = {}; }
      if(!r.ok){
        var err = new Error((j && j.error && (j.error.message || j.error.status)) || ('HTTP '+r.status));
        err.status = r.status; err.fb = j && j.error; throw err;
      }
      return j;
    });
  });
}
function fbErrText(e){
  var m = String((e && e.message) || e || '');
  if(e && e.name === 'TypeError') return 'Nessuna connessione. Riprova quando sei online.';
  if(/EMAIL_EXISTS/.test(m)) return 'Esiste già un account con questa email. Usa “Accedi”.';
  if(/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(m)) return 'Email o password non corrette.';
  if(/WEAK_PASSWORD/.test(m)) return 'La password deve avere almeno 6 caratteri.';
  if(/INVALID_EMAIL|MISSING_EMAIL/.test(m)) return 'Controlla l’indirizzo email.';
  if(/MISSING_PASSWORD/.test(m)) return 'Scrivi la password.';
  if(/TOO_MANY_ATTEMPTS/.test(m)) return 'Troppi tentativi. Aspetta qualche minuto e riprova.';
  if(/OPERATION_NOT_ALLOWED/.test(m)) return 'L’accesso con email e password non è attivo nel progetto Firebase (Authentication → Metodo di accesso → Email/password).';
  if(/USER_DISABLED/.test(m)) return 'Questo account è stato disattivato.';
  if(/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND/.test(m)) return 'Sessione scaduta: accedi di nuovo.';
  if(/has not been used|SERVICE_DISABLED|is disabled/i.test(m)) return 'Il database Firestore non è attivo: in Firebase apri Firestore Database e premi “Crea database”.';
  if(/does not exist/i.test(m)) return 'Il database Firestore non risulta creato (Firebase → Firestore Database → Crea database).';
  if(/PERMISSION_DENIED|Missing or insufficient permissions/i.test(m) || (e && e.status === 403)) return 'Permesso negato dal database. Controlla di aver incollato le regole di sicurezza in Firestore.';
  if(/NOT_FOUND/.test(m) || (e && e.status === 404)) return 'Il database Firestore non risulta creato (Firebase → Firestore Database → Crea database).';
  if(/CODE_NOT_VALID/.test(m)) return 'Codice invito non valido.';
  return 'Qualcosa non ha funzionato (' + m.slice(0, 80) + ').';
}
function fbIsAuthDead(e){ return /TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED/.test(String((e && e.message) || '')); }

/* ---- autenticazione ---- */
function fbSetSession(j){
  syncMem.idToken = j.idToken || j.id_token || syncMem.idToken;
  var secs = parseInt(j.expiresIn || j.expires_in || '3600', 10) || 3600;
  syncMem.exp = Date.now() + secs * 1000;
  SYNC.refresh = j.refreshToken || j.refresh_token || SYNC.refresh;
  SYNC.uid = j.localId || j.user_id || SYNC.uid;
  if(j.email) SYNC.email = j.email;
  syncSave();
}
function fbAuth(path, body){
  return fbFetch(FB_HOSTS.auth + '/v1/' + path + '?key=' + encodeURIComponent(FB_CFG.apiKey), {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
}
function fbToken(){
  if(syncMem.idToken && Date.now() < syncMem.exp - 60000) return Promise.resolve(syncMem.idToken);
  if(!SYNC.refresh) return Promise.reject(new Error('TOKEN_EXPIRED'));
  return fbFetch(FB_HOSTS.token + '/v1/token?key=' + encodeURIComponent(FB_CFG.apiKey), {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(SYNC.refresh)
  }).then(function(j){ fbSetSession(j); return syncMem.idToken; });
}

/* ---- Firestore (REST) ---- */
function fsBase(){ return FB_HOSTS.fs + '/v1/projects/' + FB_CFG.projectId + '/databases/(default)/documents'; }
function fsName(path){ return 'projects/' + FB_CFG.projectId + '/databases/(default)/documents/' + path; }
function fsReq(method, urlTail, body, retried){
  return fbToken().then(function(tok){
    var o = {method:method, headers:{'Authorization':'Bearer ' + tok}};
    if(body !== undefined){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
    return fbFetch(fsBase() + urlTail, o);
  }).catch(function(e){
    if(e && e.status === 401 && !retried){ syncMem.idToken = null; return fsReq(method, urlTail, body, true); }
    throw e;
  });
}
function fsGet(path){
  return fsReq('GET', '/' + path).catch(function(e){ if(e && e.status === 404 && !/does not exist/i.test(String(e.message))) return null; throw e; });
}
function fsCommit(writes){ return fsReq('POST', ':commit', {writes:writes}); }
function fsStr(v){ return {stringValue:String(v)}; }
function fsInt(v){ return {integerValue:String(v)}; }
function fsField(doc, name){
  var f = doc && doc.fields && doc.fields[name]; if(!f) return undefined;
  if('stringValue' in f) return f.stringValue;
  if('integerValue' in f) return parseInt(f.integerValue, 10);
  if('arrayValue' in f) return ((f.arrayValue && f.arrayValue.values) || []).map(function(x){ return x.stringValue; });
  if('mapValue' in f) return f.mapValue.fields || {};
  if('nullValue' in f) return null;
  return undefined;
}
function randId(n, alphabet){
  var out = '', arr = new Uint32Array(n);
  try{ crypto.getRandomValues(arr); }catch(e){ for(var i=0;i<n;i++) arr[i] = Math.floor(Math.random()*4294967296); }
  for(var k=0;k<n;k++) out += alphabet.charAt(arr[k] % alphabet.length);
  return out;
}

/* ---- sincronizzazione dei dati ---- */
function syncLocalRaw(n){

}

function syncSchedule(ms){
  if(syncMem.flushT) clearTimeout(syncMem.flushT);
  syncMem.flushT = setTimeout(function(){ syncMem.flushT = null; syncFlush().catch(function(){}); }, ms);
}
function syncPushDoc(n){
  var raw = syncLocalRaw(n);
  if(raw === null || raw === undefined){ delete SYNC.pending[n]; syncSave(); return Promise.resolve(false); }
  var ts = Date.now();
  var base = 'families/' + SYNC.fid + '/state/';
  return fsCommit([
    {update:{name:fsName(base + n), fields:{json:fsStr(raw), ts:fsInt(ts), by:fsStr(SYNC.uid)}}},
    {update:{name:fsName(base + 'meta'), fields:{updated:{mapValue:{fields:(function(){ var o = {}; o[n] = fsInt(ts); return o; })()}}}}, updateMask:{fieldPaths:['updated.' + n]}}
  ]).then(function(){ SYNC.seen[n] = ts; delete SYNC.pending[n]; syncSave(); return true; });
}
function syncFlush(){
  if(!syncActive()) return Promise.resolve();
  var names = Object.keys(SYNC.pending).filter(function(n){ return SYNC_DOCS[n]; });
  var chain = Promise.resolve();
  names.forEach(function(n){ chain = chain.then(function(){ return syncPushDoc(n); }); });
  return chain.then(function(){ syncMem.err = ''; syncMem.online = true; SYNC.last = Date.now(); syncSave(); })
    .catch(function(e){ syncFail(e); throw e; });
}
function syncFail(e){
  if(e && e.name === 'TypeError'){ syncMem.online = false; syncMem.err = ''; return; }
  syncMem.err = fbErrText(e);
  if(fbIsAuthDead(e)){ SYNC.refresh = null; syncMem.idToken = null; syncSave(); syncStop(); }
}
/* scarica le novità. first=true: appena entrati in famiglia (la famiglia vince, ciò che manca viene caricato) */
function syncPull(first){

  var fid0 = SYNC.fid;
  var base = 'families/' + SYNC.fid + '/state/';
  return fsGet(base + 'meta').then(function(meta){
    var upd = (meta && fsField(meta, 'updated')) || {};
    var todo = [], push = [];
    Object.keys(SYNC_DOCS).forEach(function(n){
      var rts = upd[n] && upd[n].integerValue ? parseInt(upd[n].integerValue, 10) : 0;
      var seen = SYNC.seen[n] || 0;
      var pend = SYNC.pending[n] || 0;
      if(rts && rts > seen){
        if(pend && pend > rts && !first) return;          /* modifica locale più recente: vince, verrà caricata */
        todo.push({n:n, ts:rts});
      } else if(!rts && first){
        if(syncLocalRaw(n) !== null) push.push(n);         /* la famiglia non ha ancora questo dato */
      }
    });
    push.forEach(function(n){ SYNC.pending[n] = Date.now(); });
    var chain = Promise.resolve(), changed = false;
    todo.forEach(function(t){
      chain = chain.then(function(){
        return fsGet(base + t.n).then(function(doc){
          var raw = doc ? fsField(doc, 'json') : null;
          if(typeof raw === 'string'){ syncApply(t.n, raw); changed = true; }
          SYNC.seen[t.n] = t.ts; delete SYNC.pending[t.n];
        });
      });
    });
    return chain.then(function(){ syncSave(); return changed; });
  }).then(function(changed){
    SYNC.last = Date.now(); syncMem.err = ''; syncMem.online = true; syncSave();
    if(changed) syncRefreshUI();
    return syncFlush();
  }).catch(function(e){
    if(SYNC.fid !== fid0) return;                       /* nel frattempo sei uscito dalla famiglia */
    if(e && e.status === 403){
      /* forse non fai più parte della famiglia: ricontrolla */
      return loadMyFamily().then(function(fid){
        if(!fid){ syncStop(); syncMem.err = ''; accState = {busy:false, msg:'', err:'Non fai più parte della famiglia.'}; syncRefreshUI(); return; }
        syncFail(e); throw e;
      });
    }
    syncFail(e); throw e;
  });
}
function syncRefreshUI(){
  try{
    var a = document.activeElement;
    if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;   /* non interrompere chi sta scrivendo */
    if(document.getElementById('diceov') && document.getElementById('diceov').classList.contains('show')) return;
    render();
  }catch(e){}
}
function syncPollOnce(){
  if(!syncActive() || syncMem.polling) return Promise.resolve();
  syncMem.polling = true;
  var pre = /^#\/account/.test(location.hash) ? loadMyFamily().catch(function(){}) : Promise.resolve();
  return pre.then(function(){ return syncActive() ? syncPull(false) : null; }).catch(function(){}).then(function(){ syncMem.polling = false; if(/^#\/account/.test(location.hash)) syncRefreshUI(); });
}
function syncStart(){
  syncStop();
  if(!syncActive()) return;
  syncMem.timer = setInterval(function(){ if(!document.hidden) syncPollOnce(); }, SYNC_POLL_MS);
}
function syncStop(){ if(syncMem.timer){ clearInterval(syncMem.timer); syncMem.timer = null; } }
function syncInit(){
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncPollOnce(); });
  window.addEventListener('online', function(){ syncMem.online = true; syncPollOnce(); });
  window.addEventListener('offline', function(){ syncMem.online = false; });
  if(syncActive()){ syncStart(); syncPollOnce(); }
}
window.syncPollOnce = syncPollOnce;
window.__sync = SYNC;

/* ---- pagina Famiglia ---- */
var accState = {busy:false, msg:'', err:''};
function accSet(o){ accState = {busy:!!o.busy, msg:o.msg || '', err:o.err || ''}; if(/^#\/account/.test(location.hash)) render(); }
function accRun(promiseFn, okMsg){
  accSet({busy:true});
  var p; try{ p = promiseFn(); }catch(e){ p = Promise.reject(e); }
  return p.then(function(){ accSet({msg:okMsg || ''}); }).catch(function(e){
    accSet({err:fbErrText(e)});
    if(fbIsAuthDead(e)){ SYNC.refresh = null; syncMem.idToken = null; syncSave(); syncStop(); render(); }
  });
}
function accVal(id){ var e = document.getElementById(id); return e ? e.value : ''; }
function accAfterSignIn(){
  return loadMyFamily().then(function(fid){
    if(fid){ SYNC.seen = {}; SYNC.pending = {}; syncSave(); syncStart(); return syncPull(true); }
  });
}
window.accSignIn = function(ev){
  if(ev) ev.preventDefault();
  var email = accVal('accEmail').trim(), pw = accVal('accPass');
  if(!email || !pw){ accSet({err:'Scrivi email e password.'}); return false; }
  SYNC.email = email; syncSave();
  accRun(function(){
    return fbAuth('accounts:signInWithPassword', {email:email, password:pw, returnSecureToken:true})
      .then(function(j){ fbSetSession(j); SYNC.email = email; syncSave(); return accAfterSignIn(); });
  }, 'Accesso eseguito.');
  return false;
};
window.accSignUp = function(){
  var email = accVal('accEmail').trim(), pw = accVal('accPass');
  if(!email || !pw){ accSet({err:'Scrivi email e password (almeno 6 caratteri).'}); return; }
  SYNC.email = email; syncSave();
  accRun(function(){
    return fbAuth('accounts:signUp', {email:email, password:pw, returnSecureToken:true})
      .then(function(j){ fbSetSession(j); SYNC.email = email; syncSave(); return accAfterSignIn(); });
  }, 'Account creato.');
};
window.accReset = function(){
  var email = accVal('accEmail').trim();
  if(!email){ accSet({err:'Scrivi prima la tua email.'}); return; }
  accRun(function(){ return fbAuth('accounts:sendOobCode', {requestType:'PASSWORD_RESET', email:email}); }, 'Ti abbiamo scritto un’email per scegliere una nuova password (controlla anche lo spam).');
};
window.accCreateFamily = function(ev){
  if(ev) ev.preventDefault();
  var name = accVal('famName');
  accRun(function(){ return createFamily(name).then(function(){ syncStart(); }); }, 'Famiglia creata. Ora condividi il codice con chi vuoi.');
  return false;
};
window.accJoinFamily = function(ev){
  if(ev) ev.preventDefault();
  var code = accVal('famCode');
  if(!code.trim()){ accSet({err:'Scrivi il codice invito.'}); return false; }
  if(!confirm('Il piano, la spesa, i preferiti, la dispensa, il quaderno e le note di questo telefono saranno sostituiti da quelli della famiglia (quello che la famiglia non ha ancora verrà aggiunto). Continuare?')) return false;
  accRun(function(){ return joinFamily(code).then(function(){ syncStart(); syncRefreshUI(); }); }, 'Sei entrato nella famiglia.');
  return false;
};
window.accLeave = function(){
  var last = (SYNC.members || 0) <= 1;
  if(!confirm(last ? 'Sei l’unico membro: la famiglia e i dati condivisi online verranno eliminati. Le cose salvate su questo telefono restano. Continuare?' : 'Uscire dalla famiglia? Le cose salvate su questo telefono restano, ma non verranno più condivise.')) return;
  accRun(function(){ return leaveFamily().then(function(){ syncStop(); }); }, 'Sei uscito dalla famiglia.');
};
window.accRenew = function(){
  if(!confirm('Creare un nuovo codice? Il vecchio smetterà di funzionare (chi è già in famiglia resta).')) return;
  accRun(function(){ return renewCode(); }, 'Nuovo codice creato.');
};
window.accSyncNow = function(){
  accRun(function(){ return loadMyFamily().then(function(){ return syncFlush(); }).then(function(){ return syncPull(false); }); }, 'Tutto aggiornato.');
};
window.accSignOut = function(){
  if(!confirm('Uscire dall’account? Le cose salvate su questo telefono restano; non verranno più sincronizzate finché non accedi di nuovo.')) return;
  syncStop();
  SYNC.refresh = null; SYNC.uid = null; SYNC.fid = null; SYNC.fname = null; SYNC.code = null; SYNC.members = 0; SYNC.seen = {}; SYNC.pending = {};
  syncMem.idToken = null; syncSave(); accSet({msg:'Sei uscito dall’account.'});
};
window.accCopyCode = function(){
  var c = SYNC.code || '';
  try{ navigator.clipboard.writeText(c).then(function(){ accSet({msg:'Codice copiato: ' + c}); }, function(){ accSet({msg:'Codice: ' + c}); }); }
  catch(e){ accSet({msg:'Codice: ' + c}); }
};
window.accShareCode = function(){
  var c = SYNC.code || '';
  var text = 'Entra nella nostra famiglia su “Il nostro ricettario”: apri l’app, vai su Io → Famiglia e scrivi il codice ' + c;
  try{ if(navigator.share){ navigator.share({title:'Il nostro ricettario', text:text}).catch(function(){}); return; } }catch(e){}
  window.accCopyCode();
};
function accStatusLine(){
  if(!syncActive()) return '';
  if(syncMem.err) return syncMem.err;
  if(!syncMem.online) return 'Senza rete: le modifiche verranno inviate appena torni online.';
  var pend = Object.keys(SYNC.pending).length;
  if(pend) return 'Invio delle modifiche in corso…';
  if(SYNC.last){ var d = new Date(SYNC.last); return 'Sincronizzato alle ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
  return 'Pronto';
}
function accIoDesc(){
  if(syncActive()) return (SYNC.fname || 'Famiglia') + ' · ' + (SYNC.members || 1) + (SYNC.members === 1 ? ' persona' : ' persone');
  if(syncSignedIn()) return 'Accesso eseguito: crea o scegli la famiglia';
  return 'Condividi piano e spesa con chi vuoi';
}
function renderAccount(){
  var h = topbar({back:'#/io', title:'Famiglia'});
  h += '<div class="chero" style="padding-bottom:2px;"><h1>Famiglia</h1></div>';
  var fb = '';
  if(accState.err) fb = '<div class="acc-msg err" role="alert">'+esc(accState.err)+'</div>';
  else if(accState.msg) fb = '<div class="acc-msg ok" role="status">'+esc(accState.msg)+'</div>';
  var dis = accState.busy ? ' disabled' : '';
  var busy = accState.busy ? '<div class="acc-busy">Un momento…</div>' : '';

  if(!syncSignedIn()){
    h += '<div class="formnote">Crea un account per condividere il piano settimanale, la lista della spesa, i preferiti, la dispensa, il quaderno e le note con chi vuoi, per esempio con tua moglie. Senza account l’app funziona come sempre, solo su questo telefono.</div>';
    h += '<form class="form-wrap acc-form" onsubmit="return accSignIn(event)">'+
      '<div class="field"><label for="accEmail">Email</label><input type="email" id="accEmail" autocomplete="email" inputmode="email" autocapitalize="off" value="'+escAttr(SYNC.email || '')+'"></div>'+
      '<div class="field"><label for="accPass">Password</label><input type="password" id="accPass" autocomplete="current-password" placeholder="Almeno 6 caratteri"></div>'+
      fb + busy +
      '<button type="submit" class="btn-primary"'+dis+'>Accedi</button>'+
      '<button type="button" class="btn-ghost" onclick="accSignUp()"'+dis+'>Crea un nuovo account</button>'+
      '<button type="button" class="acc-link" onclick="accReset()"'+dis+'>Password dimenticata?</button>'+
    '</form>';
    return h;
  }
  if(!syncActive()){
    h += '<div class="acc-who">'+ico('user')+'<span>'+esc(SYNC.email || 'Account')+'</span></div>';
    h += fb + busy;
    h += '<form class="form-wrap acc-card" onsubmit="return accCreateFamily(event)">'+
      '<h2>Crea la tua famiglia</h2>'+
      '<div class="field"><label for="famName">Nome</label><input type="text" id="famName" maxlength="60" value="La nostra famiglia"></div>'+
      '<button type="submit" class="btn-primary"'+dis+'>Crea la famiglia</button>'+
      '<p class="acc-hint">I dati di questo telefono diventano quelli della famiglia. Poi avrai un codice da dare agli altri.</p>'+
    '</form>';
    h += '<form class="form-wrap acc-card" onsubmit="return accJoinFamily(event)">'+
      '<h2>Hai un codice invito?</h2>'+
      '<div class="field"><label for="famCode">Codice</label><input type="text" id="famCode" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="Per esempio K7M2Q9XP"></div>'+
      '<button type="submit" class="btn-ghost"'+dis+'>Entra nella famiglia</button>'+
    '</form>';
    h += '<div class="acc-foot"><button class="acc-link" onclick="accSignOut()">Esci dall’account</button></div>';
    return h;
  }
  /* in famiglia */
  h += '<div class="acc-who">'+ico('user')+'<span>'+esc(SYNC.email || 'Account')+'</span></div>';
  h += '<div class="acc-fam"><div class="acc-fn">'+esc(SYNC.fname || 'Famiglia')+'</div>'+
       '<div class="acc-fm">'+(SYNC.members || 1)+((SYNC.members || 1) === 1 ? ' persona' : ' persone')+' · <span class="acc-st'+(syncMem.err ? ' bad' : '')+'">'+esc(accStatusLine())+'</span></div></div>';
  h += fb + busy;
  h += '<div class="acc-codebox"><div class="acc-cl">Codice invito</div><div class="acc-code" aria-label="Codice invito">'+esc(SYNC.code || '')+'</div>'+
       '<div class="acc-cbtns"><button class="btn-ghost" onclick="accCopyCode()">Copia</button><button class="btn-primary" onclick="accShareCode()">Condividi</button></div>'+
       '<button class="acc-link" onclick="accRenew()"'+dis+'>Crea un nuovo codice</button></div>';
  h += '<div class="formnote">Condividete: ' + Object.keys(SYNC_DOCS).map(function(n){ return SYNC_DOCS[n].label.toLowerCase(); }).join(', ') + '. Le ricette che aggiungi tu restano su questo telefono.</div>';
  h += '<div class="form-wrap"><button class="btn-ghost" onclick="accSyncNow()"'+dis+'>Sincronizza ora</button></div>';
  h += '<div class="acc-foot"><button class="danger-btn" onclick="accLeave()"'+dis+'>Esci dalla famiglia</button><button class="acc-link" onclick="accSignOut()">Esci dall’account</button></div>';
  return h;
}

  appEl = document.getElementById('app');
  applyNumMigrations();
  loadFavorites();

  loadDispensa();
  loadSpesaChecked();
  loadRecents();
  loadQuaderno();
  buildSearchIndex();

  syncInit();
});

loadTheme();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

})();
